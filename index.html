<!DOCTYPE html>
<html lang="de">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Logbuch">
<meta name="theme-color" content="#eaeef3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b111d" media="(prefers-color-scheme: dark)">

<title>Fitness-Logbuch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: Handy-Logbuch. Eine Spalte, Tab-Leiste unten, grosse Anzeigetafel-Ziffern fuer die eine Zahl, die zaehlt. */
:root{
  --bg:#eaeef3; --surface:#ffffff; --ink:#131b2c; --muted:#5b6578; --line:#d3dae4;
  --accent:#2a48e0; --accent-ink:#ffffff; --soft:#e3e8fb;
  --p:#bf336a; --c:#b97800; --f:#0b867c;
  --good:#1b8448; --warn:#b05a00; --bad:#c02d2d;
  --fd:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --fb:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b111d; --surface:#141c2c; --ink:#e9edf5; --muted:#94a1b7; --line:#27334a;
    --accent:#8296ff; --accent-ink:#0b111d; --soft:#1c2744;
    --p:#f07aa6; --c:#f0b84a; --f:#4fd1c5;
    --good:#5fd08c; --warn:#f0a35a; --bad:#f58080;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b111d; --surface:#141c2c; --ink:#e9edf5; --muted:#94a1b7; --line:#27334a;
  --accent:#8296ff; --accent-ink:#0b111d; --soft:#1c2744;
  --p:#f07aa6; --c:#f0b84a; --f:#4fd1c5;
  --good:#5fd08c; --warn:#f0a35a; --bad:#f58080;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.4;display:flex;flex-direction:column;-webkit-text-size-adjust:100%}
.wrap{width:100%;max-width:560px;margin:0 auto}
header{padding:calc(12px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left))}
header .wrap{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
header h1{font-family:var(--fd);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase;margin:0}
#sync{font-size:12px;color:var(--muted);text-align:right}
#sync.warn{color:var(--warn)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 24px}
#view{display:flex;flex-direction:column;gap:12px}
nav{background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .wrap{display:flex}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 10px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:500}
nav a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav a.on{color:var(--accent)}
nav a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
h2{font-family:var(--fd);font-weight:600;font-size:22px;letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
h3{font-size:16px;font-weight:600;margin:0}
p{margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.chead{display:flex;align-items:center;gap:10px}
.chead h3,.chead h2{flex:1}
.hero{background:var(--ink);color:var(--bg);border-radius:18px;padding:16px 16px 18px;display:flex;flex-direction:column;gap:8px}
.hero .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.hero .big{font-family:var(--fd);font-weight:700;font-size:84px;line-height:.86;letter-spacing:-.01em}
.hero .unit{font-family:var(--fd);font-size:22px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.hero .line{display:flex;justify-content:space-between;gap:8px;font-size:13px;opacity:.85}
.hero .bar{background:color-mix(in srgb,var(--bg) 22%,transparent)}
.hero .bar i{background:var(--bg)}
.hero.over .big{color:var(--warn)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.bar i.p{background:var(--p)}.bar i.c{background:var(--c)}.bar i.f{background:var(--f)}
.macros{display:flex;flex-direction:column;gap:10px}
.mbl{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.mbl span:first-child{font-weight:500}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.wide{flex:1}
.btn:disabled{opacity:.45}
.add{font:inherit;font-size:22px;line-height:1;width:40px;height:40px;border-radius:50%;border:0;background:var(--soft);color:var(--accent);cursor:pointer;font-weight:600}
.icon{font:inherit;border:0;background:none;color:var(--muted);font-size:20px;min-width:40px;min-height:40px;cursor:pointer}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:96px;resize:vertical}
label.check{flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-size:15px}
label.check input{width:22px;height:22px;min-height:0;accent-color:var(--accent)}
.datenav{display:flex;align-items:center;gap:8px}
.datenav button{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;min-width:44px;min-height:44px;font-size:20px;cursor:pointer}
.datenav .dlab{flex:1;font-size:16px;font-weight:600}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;font:inherit;color:inherit;text-align:left;width:100%;cursor:pointer}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:500;overflow-wrap:anywhere}
.item .t span{font-size:13px;color:var(--muted)}
.item .v{font-weight:600;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 12px;min-height:40px;cursor:pointer}
.chips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill{display:inline-block;white-space:nowrap;font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--soft);color:var(--accent)}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--fd);font-size:30px;font-weight:600;line-height:1}
.stat span{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hint{font-size:13px;color:var(--muted)}
.set{display:grid;grid-template-columns:24px 1fr auto 1fr 48px;gap:8px;align-items:center}
.set .sn{font-family:var(--fd);font-size:20px;color:var(--muted);text-align:center}
.set input{text-align:center;padding:10px 4px}
.set .chk{font:inherit;font-size:18px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.set.ok .chk{background:var(--good);border-color:var(--good);color:var(--surface)}
.set.ok input{border-color:var(--good)}
svg.ch{width:100%;height:auto;display:block}
svg.ch text{font-family:var(--fb);font-size:10px;fill:var(--muted)}
svg.ch .grid{stroke:var(--line);stroke-width:1}
svg.ch .ln{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
svg.ch .dot{fill:var(--muted);opacity:.55}
svg.ch .end{fill:var(--accent);stroke:var(--surface);stroke-width:2}
svg.ch .b{fill:var(--accent)}
svg.ch .b.off{fill:var(--line)}
svg.ch .tg{stroke:var(--warn);stroke-width:1.2;stroke-dasharray:4 3}
.hb{display:grid;grid-template-columns:86px 1fr 28px;gap:8px;align-items:center;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:6px 4px;border-top:1px solid var(--line)}
th{font-weight:500;color:var(--muted);border-top:0}
th:first-child,td:first-child{text-align:left}
.tw{overflow-x:auto}
#sheet{position:fixed;inset:0;display:none;z-index:20}
#sheet.open{display:block}
#sheet .back{position:absolute;inset:0;background:rgba(5,10,20,.5)}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
#sheet .inner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
#rest{display:none;background:var(--accent);color:var(--accent-ink);padding:8px 16px}
#rest.on{display:block}
#rest .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px}
#rest b{font-family:var(--fd);font-size:26px}
#rest button{font:inherit;font-weight:600;background:none;border:1px solid currentColor;color:inherit;border-radius:8px;padding:6px 10px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;display:none;z-index:30;max-width:90%;text-align:center}
#toast.on{display:block}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite;margin:6px auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.cam{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:4/3}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam i{position:absolute;left:10%;right:10%;top:50%;height:2px;background:var(--bad);opacity:.8}
.warnT{color:var(--warn)}
a.lnk{color:var(--accent)}
.hide{display:none!important}
</style>
</head>

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)?n:null};

const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};

const dn=s=>{const[a,b,c]=s.split('-').map(Number);return Math.round(Date.UTC(a,b-1,c)/864e5)};
const wd=s=>(pd(s).getDay()+6)%7;
const weekStart=s=>addD(s,-wd(s));

const IDB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('fitnesslogbuch',1);r.onupgradeneeded=()=>r.result.createObjectStore('docs');r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  all(){return new Promise((res,rej)=>{const out={},c=this.db.transaction('docs').objectStore('docs').openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue()}else res(out)};c.onerror=()=>rej(c.error)})},
  put(pairs,wipe){return new Promise((res,rej)=>{const tx=this.db.transaction('docs','readwrite'),st=tx.objectStore('docs');if(wipe)st.clear();pairs.forEach(([k,v])=>st.put(v,k));tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}

const Store={
  status:'load',dirty:new Set(),timer:null,saving:0,err:false,idb:false,
  data(id){if(id==='settings')return S.settings;if(id==='foods')return S.foods;if(id==='plans')return S.plans;if(id[0]==='m')return S.months[id.slice(2)];if(id[0]==='t')return S.wk[id.slice(2)]},

  ids(){return['settings','foods','plans',...Object.keys(S.months).map(k=>'m-'+k),...Object.keys(S.wk).map(k=>'t-'+k)]},
  save(id){this.dirty.add(id);clearTimeout(this.timer);this.timer=setTimeout(()=>this.flush(),120);sync()},
  async flush(wipe){
    clearTimeout(this.timer);
    const ids=wipe?this.ids():[...this.dirty];this.dirty.clear();
    const pairs=ids.map(id=>[id,this.data(id)]).filter(p=>p[1]).map(p=>[p[0],clone(p[1])]);
    if(!pairs.length){sync();return}
    this.saving++;sync();
    try{
      if(this.idb)await IDB.put(pairs,wipe);
      else{pairs.forEach(([k,v])=>LS.set(k,v));LS.set('ids',this.ids())}
      this.err=false;
    }catch(e){ids.forEach(id=>this.dirty.add(id));this.err=true}
    this.saving--;sync();
  },
  async init(){
    try{await IDB.open();const all=await IDB.all();Object.keys(all).forEach(id=>this.apply(id,all[id]));this.idb=true}
    catch(e){(LS.get('ids')||[]).forEach(id=>this.apply(id,LS.get(id)))}

  }
};
function sync(){

}

/* ---------- Tage, Einträge, Gewicht ---------- */
function day(ds,create){const mk=ds.slice(0,7),dk=ds.slice(8);let m=S.months[mk];if(!m){if(!create)return null;m=S.months[mk]={days:{}}}let d=m.days[dk];if(!d){if(!create)return null;d=m.days[dk]={e:[]}}if(!d.e)d.e=[];return d}
const saveDay=ds=>Store.save('m-'+ds.slice(0,7));
function tot(list){const t={k:0,p:0,c:0,f:0,fb:0};for(const e of list){const m=e.g/100;t.k+=e.k*m;t.p+=e.p*m;t.c+=e.c*m;t.f+=e.f*m;t.fb+=(e.fb||0)*m}return t}
function weights(){const a=[];for(const mk of Object.keys(S.months).sort()){const ds=S.months[mk].days;for(const dk of Object.keys(ds).sort())if(ds[dk].w)a.push({d:mk+'-'+dk,t:dn(mk+'-'+dk),w:ds[dk].w})}return a}
/* Trend: exponentiell geglätteter Mittelwert, gleicht Wasser- und Tagesschwankungen aus */
function trend(ws){let tr=null,prev=null;return ws.map(x=>{if(tr==null)tr=x.w;else{const a=1-Math.pow(0.9,Math.max(1,x.t-prev));tr+=a*(x.w-tr)}prev=x.t;return{d:x.d,t:x.t,w:x.w,tr}})}
const curWeight=()=>{const t=trend(weights());return t.length?t[t.length-1].tr:null};

/* ---------- Energiemodell ---------- */
function profileOK(){const p=S.settings.profile;return!!(p&&p.sex&&p.birth>1900&&p.height>100&&p.act&&curWeight())}
function energy(){
  const p=S.settings.profile,cur=curWeight(),age=new Date().getFullYear()-p.birth;
  const bmr=10*cur+6.25*p.height-5*age+(p.sex==='m'?5:-161);      // Mifflin-St Jeor
  const formula=bmr*p.act;
  const T=dn(today()),W=28,ws=weights().filter(x=>x.t>=T-W);
  let obs=null,conf=0,nK=0,nW=ws.length,span=0,slope=null,avgIn=null;
  if(nW>=4){
    span=ws[nW-1].t-ws[0].t;
    const mx=ws.reduce((s,x)=>s+x.t,0)/nW,my=ws.reduce((s,x)=>s+x.w,0)/nW;
    let sxy=0,sxx=0;ws.forEach(x=>{sxy+=(x.t-mx)*(x.w-my);sxx+=(x.t-mx)**2});
    if(sxx>0&&span>=7){
      slope=sxy/sxx;                                              // kg pro Tag
      let sum=0;
      for(let t=ws[0].t;t<=Math.min(ws[nW-1].t,T-1);t++){const d=day(addD(today(),t-T));if(!d)continue;const k=tot(d.e).k;if(k>=0.5*bmr){sum+=k;nK++}}
      if(nK>=5){
        avgIn=sum/nK;
        obs=clamp(avgIn-slope*7700,formula*0.75,formula*1.3);    // Energiebilanz: Aufnahme minus Speicheränderung
        conf=clamp((nK-6)/12,0,1)*clamp((nW-4)/10,0,1)*clamp((span-10)/11,0,1);
      }
    }
  }
  const tdee=obs==null?formula:formula+conf*(obs-formula);
  return{cur,bmr,formula,obs,conf,tdee,nK,nW,span,slope,avgIn};
}
function calcTargets(){
  const e=energy(),st=S.settings,g=st.goal,p=st.profile,w=e.cur,h=p.height/100;
  const pct=g.type==='cut'?-g.rate:g.type==='bulk'?g.rate:0;
  let kcal=e.tdee+pct/100*w*7700/7;
  const floor=Math.max(e.bmr,p.sex==='m'?1500:1200),capped=kcal<floor;
  kcal=Math.round(Math.max(kcal,floor)/10)*10;
  const basis=w/(h*h)>30?27.5*h*h:w;                               // bei hohem BMI Referenzgewicht statt Körpergewicht
  const pk=st.prot||(g.type==='cut'?2.2:1.8);
  const P=Math.round(pk*basis);
  const F=Math.round(Math.max((g.type==='cut'?0.7:0.9)*basis,0.2*kcal/9));
  const C=Math.max(0,Math.round((kcal-4*P-9*F)/4));
  return{date:today(),kcal,p:P,f:F,c:C,fib:Math.round(14*kcal/1000),tdee:Math.round(e.tdee),conf:Math.round(e.conf*100),capped,pk};
}
function recalc(){
  if(!profileOK())return false;
  const t=calcTargets(),st=S.settings,h=st.tHist;
  st.targets=t;
  const row={date:t.date,kcal:t.kcal,tdee:t.tdee,conf:t.conf,p:t.p,c:t.c,f:t.f};
  if(h.length&&h[h.length-1].date===t.date)h[h.length-1]=row;else h.push(row);
  if(h.length>30)h.splice(0,h.length-30);
  return true;
}
/* Wöchentliche Rückkopplung: Ziele gelten eine Woche, montags wird neu gerechnet */
function ensureTargets(){const t=S.settings.targets;if(!profileOK())return;if(!t||weekStart(t.date)<weekStart(today())){recalc();Store.save('settings')}}
function isTrain(ds){return S.settings.trainDays.includes(wd(ds))||allW().some(w=>w.d===ds)}
function dayTargets(ds){
  const t=S.settings.targets;if(!t)return null;
  const n=S.settings.trainDays.length;
  if(!S.settings.cycle||n===0||n===7)return t;
  const k=Math.round((isTrain(ds)?t.kcal*1.1:t.kcal*(1-0.1*n/(7-n)))/10)*10;
  return Object.assign({},t,{kcal:k,c:Math.max(0,Math.round((k-4*t.p-9*t.f)/4)),fib:Math.round(14*k/1000)});
}

function allW(){const a=[];for(const k in S.wk)for(const w of S.wk[k].list)a.push(w);return a.sort((x,y)=>x.s-y.s)}
const saveW=w=>Store.save('t-'+w.d.slice(0,7));
const activeW=()=>allW().find(w=>!w.e)||null;
const e1rm=(w,r)=>w>0&&r>0?w*(1+r/30):0;
const volume=w=>w.ex.reduce((s,x)=>s+x.sets.reduce((a,z)=>a+(z.ok?(z.w||0)*(z.r||0):0),0),0);
const setCount=w=>w.ex.reduce((s,x)=>s+x.sets.filter(z=>z.ok).length,0);
function groupOf(n){for(const g of GROUPS)if(EX[g].includes(n))return g;const c=S.plans.ex.find(x=>x.n===n);return c?c.g:'Sonstige'}
function lastPerf(name,notId){const a=allW();for(let i=a.length-1;i>=0;i--){const w=a[i];if(w.id===notId||!w.e)continue;const x=w.ex.find(z=>z.n===name);if(x){const s=x.sets.filter(z=>z.ok);if(s.length)return{d:w.d,sets:s}}}return null}
function bestE(name,notId){let b=0;for(const w of allW()){if(w.id===notId)continue;for(const x of w.ex)if(x.n===name)for(const z of x.sets)if(z.ok)b=Math.max(b,e1rm(z.w,z.r))}return b}
/* Doppelte Progression: erst Wiederholungen steigern, am oberen Ende das Gewicht erhöhen */
function suggest(x,wid){
  const l=lastPerf(x.n,wid);
  if(!l)return{text:'Erster Eintrag für diese Übung. Wähle ein Gewicht, mit dem '+x.min+'–'+x.max+' saubere Wiederholungen möglich sind.',ph:()=>({w:'',r:x.min})};
  const sum=l.sets.map(z=>fw(z.w||0)+' × '+z.r).join(', ');
  const top=l.sets.every(z=>z.r>=x.max)&&l.sets[0].w>0;
  if(top)return{text:'Zuletzt ('+dshort(l.d)+'): '+sum+'. Alle Sätze am oberen Ende, heute 2,5 kg mehr.',ph:i=>({w:(l.sets[Math.min(i,l.sets.length-1)].w||0)+2.5,r:x.min})};
  return{text:'Zuletzt ('+dshort(l.d)+'): '+sum+'. Gleiches Gewicht, Ziel '+x.min+'–'+x.max+' Wiederholungen.',ph:i=>{const z=l.sets[Math.min(i,l.sets.length-1)];return{w:z.w||0,r:Math.min(x.max,z.r+1)}}};
}

/* ---------- Diagramme ---------- */
function chart(series,o){
  const W=340,H=160,L=38,R=10,T=10,B=22,all=series.flatMap(s=>s.pts);if(!all.length)return'';
  let x0=Math.min(...all.map(p=>p.x)),x1=Math.max(...all.map(p=>p.x)),y0=Math.min(...all.map(p=>p.y)),y1=Math.max(...all.map(p=>p.y));
  if(x1===x0)x1=x0+1;const yp=Math.max((y1-y0)*.12,o.pad||.5);y0-=yp;y1+=yp;
  const sx=x=>L+(x-x0)/(x1-x0)*(W-L-R),sy=y=>T+(1-(y-y0)/(y1-y0))*(H-T-B);
  let g='';
  [.1,.5,.9].forEach(q=>{const y=y0+(y1-y0)*q;g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${sy(y)}" y2="${sy(y)}"/><text x="${L-5}" y="${sy(y)+3}" text-anchor="end">${o.fy(y)}</text>`});
  g+=`<text x="${L}" y="${H-6}">${o.fx(x0)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${o.fx(x1)}</text>`;
  series.forEach(s=>{
    if(s.dots)s.pts.forEach(p=>g+=`<circle class="dot" cx="${sx(p.x)}" cy="${sy(p.y)}" r="2.3"/>`);
    if(s.line&&s.pts.length){g+=`<path class="ln" d="${s.pts.map((p,i)=>(i?'L':'M')+sx(p.x).toFixed(1)+' '+sy(p.y).toFixed(1)).join('')}"/>`;const e=s.pts[s.pts.length-1];g+=`<circle class="end" cx="${sx(e.x)}" cy="${sy(e.y)}" r="4.5"/>`}
  });
  return`<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label)}">${g}</svg>`;
}
const fxDay=n=>new Date(n*864e5).toLocaleDateString('de-DE',{day:'numeric',month:'short',timeZone:'UTC'});
function weekChart(ds){
  const ws=weekStart(ds),W=340,H=130,T=14,B=18,L=6,vals=WD.map((_,i)=>{const d=day(addD(ws,i));return d?tot(d.e).k:0});
  const tg=S.settings.targets?S.settings.targets.kcal:0,max=Math.max(tg*1.15,...vals,1),bw=(W-2*L)/7,sy=v=>T+(1-v/max)*(H-T-B);
  let g='';vals.forEach((v,i)=>{const x=L+i*bw+6;g+=`<rect class="b${v?'':' off'}" x="${x}" y="${v?sy(v):H-B-2}" width="${bw-12}" height="${v?H-B-sy(v):2}" rx="3"/><text x="${x+(bw-12)/2}" y="${H-5}" text-anchor="middle">${WD[i]}</text>`;if(v)g+=`<text x="${x+(bw-12)/2}" y="${sy(v)-3}" text-anchor="middle">${f0(v)}</text>`});
  if(tg)g+=`<line class="tg" x1="${L}" x2="${W-L}" y1="${sy(tg)}" y2="${sy(tg)}"/>`;
  return`<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Kalorien pro Tag in dieser Woche">${g}</svg>`;
}

function hero(t,tg,ds){

function macros(t,tg){

function vTraining(){

    h+=`<section class="card"><button class="btn" data-a="exadd">Übung hinzufügen</button><button class="btn primary" data-a="wfinish">Training beenden</button><button class="btn danger" data-a="wdiscard">Training verwerfen</button></section>`;

  h+=`<div class="row"><button class="btn wide" data-a="planedit" data-p="new">Neuer Plan</button><button class="btn wide" data-a="wstart" data-p="free">Freies Training</button></div></section>`;
  const all=allW().filter(w=>w.e),T=today(),wk=all.filter(w=>w.d>=weekStart(T)),l7=all.filter(w=>w.d>addD(T,-7));

  const gs={};l7.forEach(w=>w.ex.forEach(x=>{const g=groupOf(x.n);gs[g]=(gs[g]||0)+x.sets.filter(z=>z.ok).length}));

  const names=[...new Set(all.flatMap(w=>w.ex.map(x=>x.n)))].sort();
  if(names.length){if(!names.includes(ui.exSel))ui.exSel=names[0];
    const pts=all.map(w=>{const x=w.ex.find(z=>z.n===ui.exSel);if(!x)return null;const b=Math.max(0,...x.sets.filter(z=>z.ok).map(z=>e1rm(z.w,z.r)));return b?{x:dn(w.d),y:b}:null}).filter(Boolean);

    h+=pts.length?chart([{pts,line:true,dots:true}],{label:'Geschätztes Maximalgewicht im Verlauf',fy:y=>f0(y)+' kg',fx:fxDay,pad:2})+`<p class="small muted num">Geschätztes Maximum für eine Wiederholung (Epley-Formel). Bestwert: ${f1(Math.max(...pts.map(p=>p.y)))} kg</p>`:`<p class="small muted">Für diese Übung gibt es noch keine Sätze mit Gewicht.</p>`;
    h+=`</section>`}

  return h+`</section>`;
}

function openSheet(html){$('#sheetIn').innerHTML=html;$('#sheet').classList.add('open');$('#sheet .panel').scrollTop=0}
function closeSheet(){stopScan();$('#sheet').classList.remove('open');$('#sheetIn').innerHTML='';if(ui.ctl){const c=ui.ctl;ui.ctl=null;c.abort()}}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2800)}
let restEnd=0;
function tick(){
  const r=$('#rest'),left=Math.ceil((restEnd-Date.now())/1000);
  if(left>0){r.classList.add('on');$('#restT').textContent=Math.floor(left/60)+':'+pad(left%60)}else{if(restEnd){restEnd=0;toast('Pause vorbei')}r.classList.remove('on')}
  const wt=$('#wtime'),aw=wt&&activeW();if(aw){const s=Math.floor((Date.now()-aw.s)/1000);wt.textContent=Math.floor(s/60)+':'+pad(s%60)}
}
setInterval(tick,1000);

/* ---------- Essen hinzufügen ---------- */
const autoMeal=()=>{const h=new Date().getHours()+new Date().getMinutes()/60;return h<10.5?0:h<15?1:h<21?2:3};
function recents(){const seen=new Set(),out=[];const mks=Object.keys(S.months).sort().reverse().slice(0,3);
  for(const mk of mks){const ds=S.months[mk].days;for(const dk of Object.keys(ds).sort().reverse())for(const e of(ds[dk].e||[]).slice().reverse()){if(!seen.has(e.n)){seen.add(e.n);out.push({n:e.n,k:e.k,p:e.p,c:e.c,f:e.f,fb:e.fb||0,pg:e.g,pn:'wie zuletzt'});if(out.length>=12)return out}}}return out}
function search(q){
  if(/^\s*(ei|eier)\s*$/i.test(q))q='Hühnerei';
  const tk=q.toLowerCase().split(/\s+/).filter(Boolean);
  if(!tk.length)return{title:'Zuletzt gegessen',list:recents()};
  const m=f=>tk.every(t=>f.n.toLowerCase().includes(t));
  const own=S.foods.items.filter(m).map(f=>Object.assign({own:1},f));
  if(!BLS.length)return{title:'Treffer',list:[...own,...FOODS.filter(m)].slice(0,40)};
  const sq=q.toLowerCase().replace(/[\s,]+/g,''),hit=BLS.filter(f=>tk.every(t=>f.lo.includes(t))||f.sq.includes(sq));
  const sc=f=>(f.lo.startsWith(tk[0])||f.sq.startsWith(sq)?0:1000)+f.n.length;
  hit.sort((a,b)=>sc(a)-sc(b));
  return{title:hit.length>40?'Treffer (die ersten 40 von '+hit.length+', Suche verfeinern)':'Treffer',list:[...own,...hit.slice(0,40)]};
}
function drawAdd(){
  openSheet(`<div class="chead"><h2>${MEALS[ui.meal]}</h2><button class="icon" data-a="close" aria-label="Schließen">×</button></div>
  <input id="q" type="search" placeholder="Lebensmittel suchen" data-i="q" autocomplete="off">
  <div class="chips"><button data-a="scan">Barcode scannen</button><button data-a="custom">Eigenes Lebensmittel</button></div>
  <div id="res"></div><p class="hint">Grundlebensmittel: Bundeslebensmittelschlüssel 4.0 (Max Rubner-Institut, 2025). Markenprodukte: © Open Food Facts contributors, von Nutzern gepflegt.</p>`);
  drawRes('');
}
const resRow=(f,i)=>`<button class="item" data-a="pickfood" data-i="${i}"><span class="t"><b>${esc(f.n)}</b><span class="num">${f0(f.k)} kcal · P ${f1(f.p)} · KH ${f1(f.c)} · F ${f1(f.f)} pro 100 g${f.own?(f.code?' · gescannt':' · eigenes'):f.bls?' · BLS':f.off?' · Open Food Facts':''}</span></span></button>`;
function drawRes(q){const r=search(q);ui.res=r.list;
  let h=r.list.length?`<p class="small muted">${r.title}</p><div class="list">`+r.list.map(resRow).join('')+`</div>`:`<p class="small muted">${q?'Im Bundeslebensmittelschlüssel nichts gefunden.':'Noch keine Einträge. Such oben nach einem Lebensmittel oder scann einen Barcode.'}</p>`;
  if(q.trim().length>=3)h+=`<button class="btn" data-a="offsearch">Markenprodukte suchen: „${esc(q.trim())}“</button>`;
  $('#res').innerHTML=h}
function drawAmt(){const a=ui.amt,f=a.food;

function amtPrev(){const a=ui.amt,x=tot([Object.assign({},a.food,{g:a.g||0})]);$('#amtP').innerHTML=`<div class="stat"><b class="num">${f0(x.k)}</b><span>kcal</span></div><div class="stat"><b class="num">${f1(x.p)} g</b><span>Protein</span></div><div class="stat"><b class="num">${f1(x.c)} / ${f1(x.f)}</b><span>KH / Fett in g</span></div>`}
function addEntry(f,g,m,ds){const d=day(ds,1);d.e.push({n:f.n,k:f.k,p:f.p,c:f.c,f:f.f,fb:f.fb||0,g,m});saveDay(ds)}
function drawCustom(pre){const p=pre||{},v=x=>x==null?'':String(x).replace('.',',');ui.cf={code:p.code||null};
  openSheet(`<div class="chead"><h2>${p.code?'Produkt anlegen':'Eigenes Lebensmittel'}</h2><button class="icon" data-a="close" aria-label="Schließen">×</button></div>

  <div class="grid2"><label>Kalorien (kcal)<input id="cK" inputmode="decimal" value="${v(p.k)}"></label><label>Protein (g)<input id="cP" inputmode="decimal" value="${v(p.p)}"></label><label>Kohlenhydrate (g)<input id="cC" inputmode="decimal" value="${v(p.c)}"></label><label>Fett (g)<input id="cF" inputmode="decimal" value="${v(p.f)}"></label><label>Ballaststoffe (g)<input id="cB" inputmode="decimal" value="${v(p.fb)}"></label><label>Übliche Portion (g)<input id="cG" inputmode="decimal" value="${v(p.pg)}"></label></div>
  <button class="btn primary" data-a="customsave">Speichern und eintragen</button>`)}

/* ---------- Barcode und Open Food Facts ---------- */
const OFF='https://world.openfoodfacts.org',OFFF='code,product_name,product_name_de,brands,quantity,serving_quantity,nutriments';
const ZXURL='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
const CAM={video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false};
let scan=null,zxP=null;
function loadZX(){return zxP||(zxP=new Promise((res,rej)=>{if(window.ZXing)return res();const s=document.createElement('script');s.src=ZXURL;s.onload=()=>res();s.onerror=()=>{zxP=null;rej({name:'ZX'})};document.head.appendChild(s)}))}
function stopScan(){const s=scan;if(!s)return;scan=null;s.stop=true;try{if(s.reader)s.reader.reset()}catch(e){}if(s.stream)s.stream.getTracks().forEach(t=>t.stop())}
async function startScan(){
  openSheet(`<div class="chead"><h2>Barcode scannen</h2><button class="icon" data-a="close" aria-label="Schließen">×</button></div>
  <div class="cam"><video id="vid" playsinline muted autoplay></video><i></i></div><p id="scanMsg" class="small muted">Kamera wird gestartet …</p>
  <label>Oder die Nummer unter dem Barcode eintippen<input id="codeIn" inputmode="numeric" autocomplete="off" placeholder="z. B. 4000417025005"></label><button class="btn" data-a="codego">Nachschlagen</button>`);
  const s=scan={stop:false},v=$('#vid'),msg=$('#scanMsg');
  const found=code=>{if(s.stop)return;stopScan();lookup(code)};
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw{name:'NoCam'};
    let fm=[];if('BarcodeDetector'in window)fm=await BarcodeDetector.getSupportedFormats().catch(()=>[]);
    if(fm.includes('ean_13')){
      const st=await navigator.mediaDevices.getUserMedia(CAM);
      if(s.stop){st.getTracks().forEach(t=>t.stop());return}
      s.stream=st;v.srcObject=st;await v.play().catch(()=>{});msg.textContent='Halte den Barcode ruhig ins Bild.';
      const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e'].filter(f=>fm.includes(f))});
      const loop=async()=>{if(s.stop)return;try{const r=await det.detect(v);if(r.length&&r[0].rawValue)return found(r[0].rawValue)}catch(e){}setTimeout(loop,200)};loop();return;
    }
    await loadZX();if(s.stop)return;
    const Z=window.ZXing,hints=new Map();hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E]);
    s.reader=new Z.BrowserMultiFormatReader(hints);
    await s.reader.decodeFromConstraints(CAM,v,r=>{if(r)found(r.getText())});
    if(s.stop){try{s.reader.reset()}catch(e){}return}
    msg.textContent='Halte den Barcode ruhig ins Bild.';
  }catch(e){if(s.stop)return;msg.classList.add('warnT');
    msg.textContent=e&&e.name==='NotAllowedError'?'Kein Kamerazugriff. Erlaub die Kamera für diese Seite in den iPhone-Einstellungen oder tipp die Nummer ein.':e&&e.name==='ZX'?'Der Scanner konnte nicht geladen werden, vermutlich fehlt die Verbindung. Tipp die Nummer ein.':'Die Kamera lässt sich hier nicht starten. Tipp die Nummer unter dem Barcode ein.'}
}
function offFood(p,code){
  const n=p&&p.nutriments;if(!n)return null;
  let k=n['energy-kcal_100g'];if(k==null&&n.energy_100g!=null)k=n.energy_100g/4.184;
  if(k==null||!isFinite(+k))return null;
  const nm=String(p.product_name_de||p.product_name||'').trim()||'Produkt',br=String(p.brands||'').split(',')[0].trim(),sv=num(p.serving_quantity),g=x=>clamp(+x||0,0,100);
  return{n:(br&&!nm.toLowerCase().includes(br.toLowerCase())?nm+' ('+br+')':nm).slice(0,90),k:Math.round(clamp(+k,0,900)),p:g(n.proteins_100g),c:g(n.carbohydrates_100g),f:g(n.fat_100g),fb:g(n.fiber_100g),pg:sv&&sv>=1&&sv<=1000?Math.round(sv):100,pn:'Portion',code:String(p.code||code||''),q:String(p.quantity||''),off:1};
}
async function offGet(url){const ctl=ui.ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),15000);
  try{const r=await fetch(url,{signal:ctl.signal}),j=await r.json().catch(()=>null);return{ok:ui.ctl===ctl,j}}
  catch(e){return{ok:ui.ctl===ctl,j:null,fail:true}}
  finally{clearTimeout(to);if(ui.ctl===ctl)ui.ctl=null}}
const offLink=code=>`<a class="lnk small" href="${OFF}/product/${encodeURIComponent(code)}" target="_blank" rel="noopener">Bei Open Food Facts ansehen oder ergänzen</a>`;
async function lookup(code){
  code=String(code).replace(/\D/g,'');if(code.length<8||code.length>14)return toast('Das ist keine gültige Barcode-Nummer.');
  const own=S.foods.items.find(f=>f.code===code);if(own){ui.amt={food:own,g:own.pg||100,m:ui.meal};return drawAmt()}
  openSheet(`<h2>Produkt wird gesucht</h2><p class="small muted num">Barcode ${esc(code)}</p><div class="spin"></div><button class="btn" data-a="backadd">Abbrechen</button>`);
  const r=await offGet(OFF+'/api/v2/product/'+code+'.json?fields='+OFFF);if(!r.ok)return;
  if(r.fail||!r.j)return openSheet(`<div class="chead"><h2>Keine Verbindung</h2><button class="icon" data-a="close" aria-label="Schließen">×</button></div><p class="small muted">Open Food Facts war nicht erreichbar. Versuch es später noch einmal oder leg das Produkt mit den Werten von der Verpackung selbst an.</p><div class="row"><button class="btn wide" data-a="codeagain" data-code="${code}">Noch einmal</button><button class="btn primary wide" data-a="customcode" data-code="${code}">Selbst anlegen</button></div>`);
  const f=r.j.status===1?offFood(r.j.product,code):null;
  if(!f)return openSheet(`<div class="chead"><h2>${r.j.status===1?'Ohne Nährwerte':'Nicht gefunden'}</h2><button class="icon" data-a="close" aria-label="Schließen">×</button></div><p class="small muted">${r.j.status===1?'Das Produkt ist bei Open Food Facts bekannt, aber ohne Kalorienangabe.':'Dieser Barcode ist bei Open Food Facts noch nicht erfasst.'} Leg es einmal mit den Werten von der Verpackung an, dann erkennt die App es beim nächsten Scan.</p><button class="btn primary" data-a="customcode" data-code="${code}">Selbst anlegen</button>${offLink(code)}`);
  ui.off=f;drawOff();
}
function drawOff(){const f=ui.off;
  openSheet(`<div class="chead"><h2>${esc(f.n)}</h2><button class="icon" data-a="close" aria-label="Schließen">×</button></div>
  <p class="small muted num">${f.q?esc(f.q)+' · ':''}Barcode ${esc(f.code)}</p>
  <div class="stats"><div class="stat"><b class="num">${f0(f.k)}</b><span>kcal pro 100 g</span></div><div class="stat"><b class="num">${f1(f.p)} g</b><span>Protein</span></div><div class="stat"><b class="num">${f0(f.c)} / ${f0(f.f)}</b><span>KH / Fett in g</span></div></div>
  <p class="small muted">Die Angaben stammen von Nutzern. Vergleich sie beim ersten Mal kurz mit der Verpackung.</p>
  <div class="row"><button class="btn primary wide" data-a="offuse">Übernehmen</button><button class="btn wide" data-a="offfix">Werte korrigieren</button></div>
  ${offLink(f.code)}<p class="hint">© Open Food Facts contributors, Open Database License</p>`)}
function keepFood(f){const c={n:f.n,k:f.k,p:f.p,c:f.c,f:f.f,fb:f.fb||0,pg:f.pg||100,pn:f.pn||'Portion'};if(f.code)c.code=f.code;
  S.foods.items=S.foods.items.filter(x=>x.n!==c.n&&!(c.code&&x.code===c.code));S.foods.items.push(c);Store.save('foods');return c}

const exPicker=act=>`<label>Übung aus der Liste<select id="exPick">${exOptions()}</select></label><button class="btn" data-a="${act}" data-src="list">Übung hinzufügen</button>
  <div class="grid2"><label>Eigene Übung<input id="exOwn" autocomplete="off" placeholder="Name"></label><label>Muskelgruppe<select id="exOwnG">${GROUPS.map(g=>`<option>${g}</option>`).join('')}</select></label></div><button class="btn" data-a="${act}" data-src="own">Eigene Übung hinzufügen</button>`;
function pickedEx(src){if(src==='list')return $('#exPick').value;const n=$('#exOwn').value.trim();if(!n){toast('Gib der Übung einen Namen.');return null}if(groupOf(n)==='Sonstige'){S.plans.ex.push({n,g:$('#exOwnG').value});Store.save('plans')}return n}
function drawPlan(){const p=ui.pe;
  openSheet(`<div class="chead"><h2>${p.idx==null?'Neuer Plan':'Plan bearbeiten'}</h2><button class="icon" data-a="close" aria-label="Schließen">×</button></div>

  ${exPicker('peadd')}
  <div class="row"><button class="btn primary wide" data-a="pesave">Plan speichern</button>${p.idx!=null?'<button class="btn danger" data-a="pedelplan">Plan löschen</button>':''}</div>`)}

/* ---------- Aktionen ---------- */
const A={
  close:closeSheet,
  dmove:el=>{ui.date=addD(ui.date,+el.dataset.v);render()},
  dtoday:()=>{ui.date=today();render()},
  water:el=>{const d=day(today(),1);d.water=Math.max(0,(d.water||0)+ +el.dataset.v);saveDay(today());render()},
  addfood:el=>{ui.meal=el.dataset.m==='auto'?autoMeal():+el.dataset.m;if(ui.tab==='heute')ui.date=today();drawAdd()},
  backadd:()=>{if(ui.ctl){const c=ui.ctl;ui.ctl=null;c.abort()}drawAdd()},
  pickfood:el=>{const f=ui.res[+el.dataset.i];if(f.off&&!f.own){ui.off=f;return drawOff()}ui.amt={food:f,g:f.pg||100,m:ui.meal};drawAmt()},
  scan:()=>startScan(),
  codego:()=>{const c=$('#codeIn').value;stopScan();lookup(c)},
  codeagain:el=>lookup(el.dataset.code),
  customcode:el=>drawCustom({code:el.dataset.code}),
  offuse:()=>{const f=keepFood(ui.off);ui.amt={food:f,g:f.pg,m:ui.meal};drawAmt()},
  offfix:()=>drawCustom(ui.off),
  offsearch:async()=>{const q=$('#q').value.trim();if(!q)return;
    $('#res').innerHTML='<p class="small muted">Open Food Facts wird durchsucht …</p><div class="spin"></div>';
    const r=await offGet(OFF+'/cgi/search.pl?search_terms='+encodeURIComponent(q)+'&search_simple=1&action=process&json=1&page_size=30&cc=de&lc=de&fields='+OFFF);
    if(!$('#res'))return;if(!r.ok&&!r.j)return;
    const list=r.j&&Array.isArray(r.j.products)?r.j.products.map(p=>offFood(p)).filter(f=>f&&f.code):null;
    if(!list){$('#res').innerHTML='<p class="small warnT">Die Markensuche hat nicht geantwortet. Sie ist bei Open Food Facts auf wenige Anfragen pro Minute begrenzt; der Barcode-Scan ist zuverlässiger.</p>';return}
    ui.res=list;$('#res').innerHTML=list.length?'<p class="small muted">Markenprodukte, © Open Food Facts contributors</p><div class="list">'+list.map(resRow).join('')+'</div>':'<p class="small muted">Keine Markenprodukte gefunden. Scann den Barcode oder leg das Produkt selbst an.</p>'},
  editentry:el=>{const ix=+el.dataset.ix,e=day(ui.date).e[ix];ui.amt={food:e,g:e.g,m:e.m,ix};drawAmt()},
  amtset:el=>{ui.amt.g=+el.dataset.g;$('#amtG').value=fw(ui.amt.g);amtPrev()},
  amtsave:()=>{const a=ui.amt;if(!(a.g>0))return toast('Trag eine Menge ein.');if(a.ix!=null){const e=day(ui.date).e[a.ix];e.g=a.g;e.m=a.m;saveDay(ui.date)}else addEntry(a.food,a.g,a.m,ui.date);closeSheet();render()},
  amtdel:()=>{day(ui.date).e.splice(ui.amt.ix,1);saveDay(ui.date);closeSheet();render()},
  custom:()=>drawCustom(),
  customsave:()=>{const n=$('#cN').value.trim(),k=num($('#cK').value);if(!n||k==null)return toast('Name und Kalorien werden gebraucht.');
    const f={n,k,p:num($('#cP').value)||0,c:num($('#cC').value)||0,f:num($('#cF').value)||0,fb:num($('#cB').value)||0,pg:num($('#cG').value)||100,pn:'Portion'};
    if(ui.cf&&ui.cf.code)f.code=ui.cf.code;const c=keepFood(f);ui.amt={food:c,g:c.pg,m:ui.meal};drawAmt()},
  tday:el=>{const d=+el.dataset.d,a=S.settings.trainDays,i=a.indexOf(d);if(i<0)a.push(d);else a.splice(i,1);Store.save('settings');render()},
  recalc:()=>{if(recalc()){Store.save('settings');render();toast('Ziele neu berechnet')}},
  backup:async()=>{const name='fitness-logbuch-'+today()+'.json',txt=JSON.stringify({app:'fitness-logbuch',exportiert:new Date().toISOString(),settings:S.settings,foods:S.foods,plans:S.plans,months:S.months,trainings:S.wk});
    S.settings.lastBackup=today();Store.save('settings');
    try{const file=new File([txt],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return render()}}catch(e){if(e&&e.name==='AbortError')return render()}
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();render()},
  restore:()=>{const i=$('#fRestore');i.value='';i.click()},
  restorego:async()=>{const d=ui.rs;S.settings=Object.assign(DEF(),d.settings);S.foods=Object.assign({items:[]},d.foods);S.plans=Object.assign({plans:[],ex:[]},d.plans);S.months=d.months||{};S.wk=d.trainings||{};
    await Store.flush(true);closeSheet();afterLoad();render();toast(Store.err?'Sicherung konnte nicht gespeichert werden':'Sicherung eingespielt')},
  tpl:el=>{TPL[+el.dataset.t].plans.forEach(p=>S.plans.plans.push(parsePlan(p)));Store.save('plans');render()},
  planedit:el=>{const i=el.dataset.p;ui.pe=i==='new'?{idx:null,name:'',ex:[]}:Object.assign({idx:+i},clone(S.plans.plans[+i]));drawPlan()},
  peadd:el=>{const n=pickedEx(el.dataset.src);if(!n)return;ui.pe.ex.push({n,sets:3,min:8,max:12});drawPlan()},
  pedel:el=>{ui.pe.ex.splice(+el.dataset.x,1);drawPlan()},
  peup:el=>{const i=+el.dataset.x,a=ui.pe.ex;[a[i-1],a[i]]=[a[i],a[i-1]];drawPlan()},
  pesave:()=>{const p=ui.pe;if(!p.name.trim())return toast('Gib dem Plan einen Namen.');if(!p.ex.length)return toast('Füge mindestens eine Übung hinzu.');
    const pl={name:p.name.trim(),ex:p.ex.map(x=>({n:x.n,sets:clamp(Math.round(x.sets)||3,1,10),min:Math.max(1,Math.round(x.min)||8),max:Math.max(Math.round(x.min)||8,Math.round(x.max)||12)}))};
    if(p.idx==null)S.plans.plans.push(pl);else S.plans.plans[p.idx]=pl;Store.save('plans');closeSheet();render()},
  pedelplan:el=>{if(el.dataset.sure){S.plans.plans.splice(ui.pe.idx,1);Store.save('plans');closeSheet();render()}else{el.dataset.sure=1;el.textContent='Wirklich löschen'}},
  wstart:el=>{const p=el.dataset.p==='free'?null:S.plans.plans[+el.dataset.p];
    const w={id:Date.now().toString(36),d:today(),name:p?p.name:'Freies Training',s:Date.now(),e:null,ex:(p?p.ex:[]).map(x=>({n:x.n,min:x.min,max:x.max,sets:Array.from({length:x.sets},()=>({w:null,r:null,ok:false}))}))};
    const k=w.d.slice(0,7);(S.wk[k]=S.wk[k]||{list:[]}).list.push(w);saveW(w);render();$('main').scrollTop=0;if(!p)A.exadd()},
  exadd:()=>openSheet(`<div class="chead"><h2>Übung hinzufügen</h2><button class="icon" data-a="close" aria-label="Schließen">×</button></div>${exPicker('exaddgo')}`),
  exaddgo:el=>{const n=pickedEx(el.dataset.src);if(!n)return;const w=activeW();w.ex.push({n,min:8,max:12,sets:[0,1,2].map(()=>({w:null,r:null,ok:false}))});saveW(w);closeSheet();render()},
  exdel:el=>{const w=activeW();w.ex.splice(+el.dataset.x,1);saveW(w);render()},
  setadd:el=>{const w=activeW();w.ex[+el.dataset.x].sets.push({w:null,r:null,ok:false});saveW(w);render()},
  setrem:el=>{const w=activeW(),s=w.ex[+el.dataset.x].sets;if(s.length>1)s.pop();saveW(w);render()},
  setok:el=>{const w=activeW(),xi=+el.dataset.x,si=+el.dataset.s,x=w.ex[xi],z=x.sets[si];
    if(z.ok){z.ok=false;saveW(w);return render()}
    const wi=$('#w'+xi+'_'+si),ri=$('#r'+xi+'_'+si),wv=num(wi.value)??num(wi.placeholder)??0,rv=num(ri.value)??num(ri.placeholder);
    if(!(rv>0))return toast('Trag die Wiederholungen ein.');
    z.w=wv;z.r=Math.round(rv);const best=bestE(x.n,w.id),mine=Math.max(0,...x.sets.filter(q=>q.ok).map(q=>e1rm(q.w,q.r)));z.ok=true;saveW(w);
    restEnd=Date.now()+(S.settings.rest||120)*1000;render();
    const e=e1rm(z.w,z.r);if(best>0&&e>best+0.01&&e>mine)toast('Neue Bestleistung bei '+x.n)},
  restskip:()=>{restEnd=0;$('#rest').classList.remove('on')},
  wfinish:()=>{const w=activeW();w.ex.forEach(x=>x.sets=x.sets.filter(z=>z.ok));w.ex=w.ex.filter(x=>x.sets.length);
    if(!w.ex.length){const l=S.wk[w.d.slice(0,7)].list;l.splice(l.indexOf(w),1);toast('Kein Satz abgehakt, Training nicht gespeichert')}else{w.e=Date.now();toast('Training gespeichert')}
    saveW(w);restEnd=0;render();$('main').scrollTop=0},
  wdiscard:el=>{if(!el.dataset.sure){el.dataset.sure=1;el.textContent='Wirklich verwerfen';return}const w=activeW(),l=S.wk[w.d.slice(0,7)].list;l.splice(l.indexOf(w),1);saveW(w);restEnd=0;render()},
  wshow:el=>{const w=allW().find(x=>x.id===el.dataset.id);ui.wid=w.id;
    openSheet(`<div class="chead"><h2>${esc(w.name)}</h2><button class="icon" data-a="close" aria-label="Schließen">×</button></div><p class="small muted num">${dlabel(w.d)} · ${Math.round((w.e-w.s)/6e4)} min · ${f0(volume(w))} kg bewegt</p>
    ${w.ex.map(x=>`<div><h3>${esc(x.n)}</h3><p class="small num muted">${x.sets.map(z=>fw(z.w||0)+' kg × '+z.r).join(' · ')}</p></div>`).join('')}<button class="btn danger" data-a="wdel">Training löschen</button>`)},
  wdel:el=>{if(!el.dataset.sure){el.dataset.sure=1;el.textContent='Wirklich löschen';return}const w=allW().find(x=>x.id===ui.wid),l=S.wk[w.d.slice(0,7)].list;l.splice(l.indexOf(w),1);saveW(w);closeSheet();render()}
};
const C={
  wt:el=>{const v=num(el.value),d=day(today(),1);if(v==null||v===0)delete d.w;else if(v<30||v>300)return toast('Bitte ein Gewicht zwischen 30 und 300 kg eintragen.');else d.w=v;saveDay(today());
    if(!S.settings.targets&&recalc())Store.save('settings');render()},
  pf:el=>{const k=el.dataset.k,st=S.settings;st.profile=st.profile||{};const v=el.value;
    if(k==='sex')st.profile.sex=v;else if(k==='birth'||k==='height'||k==='act')st.profile[k]=num(v);
    else if(k==='weight'){const w=num(v);if(w&&w>=30&&w<=300){day(today(),1).w=w;saveDay(today())}else if(v)return toast('Bitte ein Gewicht zwischen 30 und 300 kg eintragen.')}
    else if(k==='gtype'){st.goal.type=v;st.goal.rate=v==='bulk'?0.25:0.5}
    else if(k==='grate')st.goal.rate=num(v);
    else if(k==='prot'){const p=num(v);st.prot=p?clamp(p,1.2,3):null}
    else if(k==='cycle')st.cycle=el.checked;
    else if(k==='rest')st.rest=clamp(Math.round(num(v)||120),15,600);
    recalc();Store.save('settings');render()},
  amtm:el=>{ui.amt.m=+el.value},
  exsel:el=>{ui.exSel=el.value;render()}
};
const I={
  q:el=>drawRes(el.value),
  amtg:el=>{ui.amt.g=num(el.value)||0;amtPrev()},
  pename:el=>{ui.pe.name=el.value},
  pef:el=>{ui.pe.ex[+el.dataset.x][el.dataset.k]=num(el.value)||0},
  setv:el=>{const w=activeW();if(!w)return;const z=w.ex[+el.dataset.x].sets[+el.dataset.s],v=num(el.value);z[el.dataset.k]=v==null?null:(el.dataset.k==='r'?Math.round(v):v);saveW(w)}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&A[el.dataset.a])A[el.dataset.a](el)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-c]');if(el&&C[el.dataset.c])C[el.dataset.c](el)});
document.addEventListener('input',e=>{const el=e.target.closest('[data-i]');if(el&&I[el.dataset.i])I[el.dataset.i](el)});
$('#fRestore').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;
  try{const d=JSON.parse(await f.text());if(!d||typeof d!=='object'||!d.settings||!d.months)throw 0;ui.rs=d;
    const days=Object.values(d.months).reduce((s,m)=>s+Object.keys(m.days||{}).length,0);
    openSheet(`<div class="chead"><h2>Sicherung einspielen</h2><button class="icon" data-a="close" aria-label="Schließen">×</button></div><p class="small muted">Stand ${d.exportiert?esc(new Date(d.exportiert).toLocaleString('de-DE')):'unbekannt'}, ${days} Tage mit Einträgen. Alle Daten, die jetzt in der App stehen, werden ersetzt.</p><button class="btn danger" data-a="restorego">Jetzt ersetzen</button>`)}
  catch(err){toast('Diese Datei ist keine Sicherung des Fitness-Logbuchs.')}});
window.addEventListener('hashchange',route);
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopScan();if(Store.dirty.size)Store.flush()}else if(Store.status==='ok'){ensureTargets();if(!$('#sheet').classList.contains('open'))render()}});
window.addEventListener('pagehide',()=>{if(Store.dirty.size)Store.flush()});

/* ---------- Start ---------- */
ui.tab=VIEWS[location.hash.slice(1)]?location.hash.slice(1):'heute';
Store.init();
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
