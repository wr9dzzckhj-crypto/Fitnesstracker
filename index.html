<style>
/* Layout: iOS-Muster. Gruppierter Hintergrund, Karten ohne Rahmen, großer Titel, der mitscrollt, Tab-Leiste unten.
   Schrift ist die Systemschrift und folgt der Textgröße aus den iPhone-Einstellungen (Dynamic Type). */
:root{
  --bg:#f2f2f7; --surface:#ffffff; --ink:#000000; --muted:#63636a; --line:#d1d1d6; --fill:#e9e9ee;
  --accent:#0066d6; --accent-ink:#ffffff; --soft:#e2eefc;
  --p:#d6336c; --c:#b86e00; --f:#0a8577;
  --good:#1e8a3c; --warn:#a85400; --bad:#d12a2a;
  --bar:rgba(249,249,251,.86); --sheet:#f2f2f7; --sfill:#ffffff; --body:#d6d6dc; --body2:#b9b9c1; --mus:#e5483b;
  --fb:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --fd:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000000; --surface:#1c1c1e; --ink:#ffffff; --muted:#a3a3ab; --line:#3a3a3c; --fill:#2c2c2e;
    --accent:#4da2ff; --accent-ink:#00172e; --soft:#12294a;
    --p:#ff6b9c; --c:#ffb340; --f:#4fd6c8;
    --good:#4cd471; --warn:#ffac4d; --bad:#ff6961;
    --bar:rgba(22,22,24,.86); --sheet:#1c1c1e; --sfill:#2c2c2e; --body:#48484d; --body2:#63636a; --mus:#ff6a5c;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;font-size:17px;font:-apple-system-body;-webkit-text-size-adjust:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:1rem;line-height:1.3;display:flex;flex-direction:column}
#statusfill{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);z-index:5}
.wrap{width:100%;max-width:560px;margin:0 auto}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) 28px max(16px,env(safe-area-inset-left))}
header{padding:14px 4px 10px}
header h1{font-size:2.05rem;line-height:1.1;font-weight:700;letter-spacing:.01em;margin:0}
#sync{font-size:.76rem;color:var(--muted);margin-top:3px}
#sync.warn{color:var(--warn)}
#view{display:flex;flex-direction:column;gap:16px}
nav{background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .wrap{display:flex}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 5px;min-height:49px;color:var(--muted);text-decoration:none;font-size:10px;font-weight:500}
nav a svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav a.on{color:var(--accent)}
nav a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.88rem}
h2{font-size:1.2rem;font-weight:600;margin:0;text-wrap:balance;overflow-wrap:anywhere}
h3{font-size:1rem;font-weight:600;margin:0;overflow-wrap:anywhere}
p{margin:0}
.card{background:var(--surface);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.chead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chead h3,.chead h2{flex:1;min-width:0}
.hero{flex-direction:row;align-items:center;gap:18px;flex-wrap:wrap;padding:18px 16px}
.ring{width:6.4rem;height:6.4rem;flex:none}
.ring circle{fill:none;stroke-width:11}
.ring .rt{stroke:var(--fill)}
.ring .rp{stroke:var(--accent);stroke-linecap:round}
.hero.over .rp{stroke:var(--warn)}
.hnum{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 8.5rem}
.hero .eyebrow{font-size:.76rem;font-weight:600;color:var(--accent)}
.hero .big{font-family:var(--fd);font-weight:700;font-size:min(3.1rem,17vw);line-height:1;letter-spacing:-.01em}
.hero.over .big{color:var(--warn)}
.hero .unit{font-size:1rem;font-weight:600}
.hero .line{font-size:.82rem;color:var(--muted);margin-top:4px}
.bar{height:8px;border-radius:4px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.bar i.p{background:var(--p)}.bar i.c{background:var(--c)}.bar i.f{background:var(--f)}
.macros{display:flex;flex-direction:column;gap:12px}
.mbl{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.94rem;margin-bottom:5px}
.mbl span:first-child{font-weight:600}
.mbl span:last-child{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.2rem,1fr));gap:12px}
.btn{font:inherit;font-weight:600;border:0;background:var(--soft);color:var(--accent);border-radius:12px;padding:12px 16px;min-height:50px;cursor:pointer;text-align:center;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.btn.wide{flex:1}
.btn:disabled{opacity:.4}
.btn:active,.chips button:active,.add:active,.set .chk:active{opacity:.6}
.add{font:inherit;font-size:1.5rem;line-height:1;width:44px;height:44px;border-radius:50%;border:0;background:var(--soft);color:var(--accent);cursor:pointer;font-weight:500}
.icon{font:inherit;border:0;background:none;color:var(--muted);font-size:1.3rem;min-width:44px;min-height:44px;cursor:pointer}
.navbtn{font:inherit;border:0;background:none;color:var(--accent);min-height:44px;padding:0 4px;cursor:pointer}
label{display:flex;flex-direction:column;gap:6px;font-size:.82rem;color:var(--muted);font-weight:500}
input,select,textarea{font:inherit;font-size:max(1rem,16px);color:var(--ink);background:var(--fill);border:0;border-radius:10px;padding:11px 12px;min-height:46px;width:100%;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.75}
textarea{min-height:96px;resize:vertical}
label.check{flex-direction:row;align-items:center;gap:12px;color:var(--ink);font-size:1rem;font-weight:400;min-height:44px}
label.check input{width:24px;height:24px;min-height:0;padding:0;accent-color:var(--accent);-webkit-appearance:auto;appearance:auto;flex:none}
.datenav{display:flex;align-items:center;gap:8px}
.datenav button{font:inherit;border:0;background:var(--surface);color:var(--accent);border-radius:12px;min-width:46px;min-height:46px;font-size:1.3rem;cursor:pointer}
.datenav .dlab{flex:1;font-size:1rem;font-weight:600;color:var(--ink)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:11px 0;min-height:44px;border:0;border-top:.5px solid var(--line);background:none;font:inherit;color:inherit;text-align:left;width:100%;cursor:pointer}
.list .item:first-child{border-top:0}
.card>.chead+.list .item:first-child{border-top:.5px solid var(--line)}
button.item::after{content:"";width:8px;height:8px;border-right:2px solid var(--line);border-top:2px solid var(--line);transform:rotate(45deg);flex:none;margin:0 3px 0 2px}
button.item:active{opacity:.55}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:400;overflow-wrap:anywhere}
.item .t span{font-size:.82rem;color:var(--muted)}
.item .v{font-weight:600;white-space:nowrap}
.item .t .row{font-size:1rem}
.item .t .row .btn{min-height:44px;padding:9px 16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{font:inherit;font-size:.94rem;font-weight:500;border:0;background:var(--soft);color:var(--accent);border-radius:999px;padding:9px 15px;min-height:44px;cursor:pointer}
.chips button.on{background:var(--accent);color:var(--accent-ink)}
.chips.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(4.6rem,1fr));gap:6px}
.chips.seg button{padding:9px 4px}
.pill{display:inline-block;white-space:nowrap;font-size:.76rem;font-weight:600;border-radius:999px;padding:3px 9px;background:var(--fill);color:var(--muted)}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--fd);font-size:1.55rem;font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.stat span{font-size:.76rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(5.4rem,1fr));gap:12px}
.hint{font-size:.8rem;color:var(--muted)}
.set{display:grid;grid-template-columns:1.2rem 1fr auto 1fr 3.5rem 46px;gap:6px;align-items:center}
.set .rs{padding:11px 2px;text-align:center;text-align-last:center;background-image:none;font-size:.9rem}
.set .sn{font-family:var(--fd);font-weight:600;color:var(--muted);text-align:center}
.set input{text-align:center;padding:11px 4px}
.set .chk{font:inherit;font-size:1.1rem;font-weight:700;height:46px;border-radius:12px;border:0;background:var(--fill);color:var(--muted);cursor:pointer}
.set.ok .chk{background:var(--good);color:var(--surface)}
.set.ok input{background:color-mix(in srgb,var(--good) 14%,transparent)}
svg.ch{width:100%;height:auto;display:block}
svg.ch text{font-family:var(--fb);font-size:10px;fill:var(--muted)}
svg.ch .grid{stroke:var(--line);stroke-width:.6}
svg.ch .ln{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
svg.ch .dot{fill:var(--muted);opacity:.5}
svg.ch .end{fill:var(--accent);stroke:var(--surface);stroke-width:2}
svg.ch .b{fill:var(--accent)}
svg.ch .b.off{fill:var(--fill)}
svg.ch .tg{stroke:var(--warn);stroke-width:1.2;stroke-dasharray:4 3}
.hb{display:grid;grid-template-columns:5.6rem 1fr 1.8rem;gap:10px;align-items:center;font-size:.94rem}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:right;padding:9px 4px;border-top:.5px solid var(--line)}
th{font-weight:500;color:var(--muted);border-top:0;font-size:.8rem}
th:first-child,td:first-child{text-align:left}
.tw{overflow-x:auto}
#sheet{position:fixed;inset:0;display:none;z-index:20}
#sheet.open{display:block}
#sheet .back{position:absolute;inset:0;background:rgba(0,0,0,.4)}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:calc(100% - env(safe-area-inset-top) - 20px);overflow-y:auto;background:var(--sheet);border-radius:16px 16px 0 0;padding:8px max(16px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));animation:up .28s cubic-bezier(.2,.8,.2,1)}
#sheet .panel::before{content:"";display:block;width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 6px}
#sheet .inner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
#sheet .inner>.chead{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;flex-wrap:nowrap}
#sheet .inner>.chead h2{grid-column:2;grid-row:1;font-size:1rem;font-weight:600;text-align:center;max-width:56vw}
#sheet .inner>.chead .navbtn{grid-column:1;grid-row:1;justify-self:start}
#sheet .inner>h2{text-align:center;font-size:1rem;padding-top:10px}
#sheet input,#sheet select,#sheet textarea{background:var(--sfill)}
#sheet .card{padding:12px;background:var(--sfill)}
#sheet .card input{background:var(--sheet)}
@keyframes up{from{transform:translateY(40%);opacity:.4}to{transform:none;opacity:1}}
#rest{display:none;background:var(--accent);color:var(--accent-ink);padding:8px 16px}
#rest.on{display:block}
#rest .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px}
#rest b{font-family:var(--fd);font-size:1.5rem}
#rest button{font:inherit;font-weight:600;background:none;border:1px solid currentColor;color:inherit;border-radius:10px;padding:6px 12px;min-height:44px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:.9rem;font-weight:500;display:none;z-index:30;max-width:90%;text-align:center}
#toast.on{display:block}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--fill);border-top-color:var(--accent);animation:sp 1s linear infinite;margin:6px auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin,#sheet .panel{animation:none}}
.cam{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:4/3}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam i{position:absolute;left:10%;right:10%;top:50%;height:2px;background:var(--bad);opacity:.8}
.bm{display:block;height:auto;flex:none}
.bm .n{fill:var(--body)}
.bm .h{fill:var(--body2)}
.bm .o{fill:none;stroke:var(--body2);stroke-width:1;vector-effect:non-scaling-stroke}
.bm .m{fill:var(--mus)}
.bm.sm{width:5.8rem}.bm.md{width:8.6rem}.bm.lg{width:min(100%,19rem);margin:0 auto}
.bm.pulse .pp{animation:mp 1.8s ease-in-out infinite}
@keyframes mp{50%{fill-opacity:.55}}
@media (prefers-reduced-motion:reduce){.bm.pulse .pp{animation:none}}
.exh{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.exh .exm{flex:1 1 9.5rem;min-width:0;display:flex;flex-direction:column;gap:3px;overflow-wrap:anywhere;hyphens:auto}
.bmbtn{border:0;background:var(--fill);border-radius:12px;padding:8px 6px;cursor:pointer;flex:none}
#sheet .bmbtn,#sheet .mapbox{background:var(--sfill)}
.tm{font-size:.94rem;font-weight:600;color:var(--mus)}
.mapbox{background:var(--fill);border-radius:14px;padding:14px}
.lg2{display:flex;flex-direction:column;gap:8px}
.lg2 div{display:flex;gap:10px;align-items:baseline}
.lg2 i{width:.8rem;height:.8rem;border-radius:50%;background:var(--mus);flex:none;transform:translateY(.08rem)}
.lg2 i.s{opacity:.38}
.lg2 b{font-weight:600}
.wkl{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.wkl .small{font-weight:400}
.datenav button:disabled{opacity:.35}
.rxbox{background:var(--fill);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center}
.rxv{font-family:var(--fd);font-size:2.3rem;font-weight:700;line-height:1.1}
.stp{display:flex;flex-direction:column;gap:6px}
.stp>span{font-size:.82rem;color:var(--muted);font-weight:500}
.stp2{display:grid;grid-template-columns:repeat(auto-fit,minmax(8rem,1fr));gap:12px}
.stp>div{display:grid;grid-template-columns:46px 1fr 46px;gap:5px}
.stp button{font:inherit;font-size:1.5rem;font-weight:500;border:0;border-radius:12px;background:var(--soft);color:var(--accent);min-height:52px;cursor:pointer;padding:0}
.stp input{text-align:center;font-family:var(--fd);font-size:1.4rem;font-weight:700;min-height:52px;padding:6px 2px}
.rirc{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.rirc button{padding:9px 0;min-height:50px;font-family:var(--fd);font-size:1.15rem;font-weight:700;border-radius:12px}
.btn.big{min-height:58px;font-size:1.1rem}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:26px;height:6px;border-radius:3px;background:var(--fill)}
.dots i.d{background:var(--good)}.dots i.c{background:var(--accent)}
.opt{font:inherit;text-align:left;border:2px solid transparent;background:var(--sfill);color:var(--ink);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-height:50px}
.opt.on{border-color:var(--accent)}
.opt b{font-weight:600}
.opt span{font-size:.82rem;color:var(--muted)}
input[type=date]{min-width:0}
.warnT{color:var(--warn)}
a.lnk{color:var(--accent)}
.hide{display:none!important}
</style>
</head>

<script>
"use strict";
const APPV='15.11.2026 · 10';
/* ---------- Helfer ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)?n:null};
const f0=n=>Math.round(n).toLocaleString('de-DE');
const f1=n=>(Math.round(n*10)/10).toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1});
const fw=n=>(Math.round(n*100)/100).toLocaleString('de-DE',{maximumFractionDigits:2});
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const dn=s=>{const[a,b,c]=s.split('-').map(Number);return Math.round(Date.UTC(a,b-1,c)/864e5)};
const wd=s=>(pd(s).getDay()+6)%7;
const weekStart=s=>addD(s,-wd(s));
const dlabel=s=>s===today()?'Heute':s===addD(today(),-1)?'Gestern':pd(s).toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'});
const dshort=s=>pd(s).toLocaleDateString('de-DE',{day:'numeric',month:'short'});
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const clone=o=>JSON.parse(JSON.stringify(o));
const WD=['Mo','Di','Mi','Do','Fr','Sa','So'];
const MEALS=['Frühstück','Mittagessen','Abendessen','Snacks'];

/* ---------- Stammdaten: Lebensmittel (Richtwerte pro 100 g, gerundet) ---------- */
/* Name|kcal|Protein|KH|Fett|Ballaststoffe|Portion g|Portionsname */

const GMUS={'Brust':['chest'],'Rücken':['lats','traps'],'Schultern':['delt','rdelt'],'Beine':['quads','hams'],'Gesäß':['glutes'],'Arme':['biceps','triceps'],'Rumpf':['abs','obliques']};
const musOf=n=>EXM[n]||{p:GMUS[groupOf(n)]||[],s:[],cue:''};
function exLevels(names){const lv={};names.forEach(n=>{const m=musOf(n);m.s.forEach(k=>{if(!lv[k])lv[k]=.38});m.p.forEach(k=>lv[k]=1)});return lv}

/* ---------- Zustand ---------- */
const DEF=()=>({v:1,profile:null,goal:{type:'keep',rate:0.5},prot:null,trainDays:[],cycle:false,rest:120,targets:null,tHist:[],actAdj:true});
const S={settings:DEF(),foods:{items:[]},plans:{plans:[],ex:[]},months:{},wk:{}};
const ui={tab:'heute',date:today(),exSel:null,focus:true,fx:0};

/* ---------- Speicher: IndexedDB auf diesem Gerät ---------- */
const IDB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('fitnesslogbuch',1);r.onupgradeneeded=()=>r.result.createObjectStore('docs');r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  all(){return new Promise((res,rej)=>{const out={},c=this.db.transaction('docs').objectStore('docs').openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue()}else res(out)};c.onerror=()=>rej(c.error)})},
  put(pairs,wipe){return new Promise((res,rej)=>{const tx=this.db.transaction('docs','readwrite'),st=tx.objectStore('docs');if(wipe)st.clear();pairs.forEach(([k,v])=>st.put(v,k));tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}
};
const LS={get(k){try{return JSON.parse(localStorage.getItem('fl1:'+k))}catch(e){return null}},set(k,v){try{localStorage.setItem('fl1:'+k,JSON.stringify(v))}catch(e){}}};
const Store={
  status:'load',dirty:new Set(),timer:null,saving:0,err:false,idb:false,
  data(id){if(id==='settings')return S.settings;if(id==='foods')return S.foods;if(id==='plans')return S.plans;if(id[0]==='m')return S.months[id.slice(2)];if(id[0]==='t')return S.wk[id.slice(2)]},
  apply(id,d){if(!d)return;if(id==='settings')S.settings=Object.assign(DEF(),d);else if(id==='foods')S.foods=Object.assign({items:[]},d);else if(id==='plans')S.plans=Object.assign({plans:[],ex:[]},d);else if(id.startsWith('m-'))S.months[id.slice(2)]=Object.assign({days:{}},d);else if(id.startsWith('t-'))S.wk[id.slice(2)]=Object.assign({list:[]},d)},
  ids(){return['settings','foods','plans',...Object.keys(S.months).map(k=>'m-'+k),...Object.keys(S.wk).map(k=>'t-'+k)]},
  save(id){this.dirty.add(id);clearTimeout(this.timer);this.timer=setTimeout(()=>this.flush(),120);sync()},
  async flush(wipe){
    clearTimeout(this.timer);
    const ids=wipe?this.ids():[...this.dirty];this.dirty.clear();
    const pairs=ids.map(id=>[id,this.data(id)]).filter(p=>p[1]).map(p=>[p[0],clone(p[1])]);
    if(!pairs.length){sync();return}
    this.saving++;sync();
    try{
      if(this.idb)await IDB.put(pairs,wipe);
      else{pairs.forEach(([k,v])=>LS.set(k,v));LS.set('ids',this.ids())}
      this.err=false;
    }catch(e){ids.forEach(id=>this.dirty.add(id));this.err=true}
    this.saving--;sync();
  },
  async init(){
    try{await IDB.open();const all=await IDB.all();Object.keys(all).forEach(id=>this.apply(id,all[id]));this.idb=true}
    catch(e){(LS.get('ids')||[]).forEach(id=>this.apply(id,LS.get(id)))}
    this.status='ok';afterLoad();render();
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  }
};
function sync(){
  const el=$('#sync');let t='',w=false;
  if(Store.status==='load')t='Lädt …';
  else if(Store.err){t='Speichern fehlgeschlagen';w=true}
  else if(Store.saving||Store.dirty.size)t='Speichert …';
  else t='Auf diesem Gerät gespeichert';
  el.textContent=t;el.className=w?'warn':'';
}
function afterLoad(){S.settings=Object.assign(DEF(),S.settings);ensureTargets()}

/* ---------- Tage, Einträge, Gewicht ---------- */
function day(ds,create){const mk=ds.slice(0,7),dk=ds.slice(8);let m=S.months[mk];if(!m){if(!create)return null;m=S.months[mk]={days:{}}}let d=m.days[dk];if(!d){if(!create)return null;d=m.days[dk]={e:[]}}if(!d.e)d.e=[];return d}
const saveDay=ds=>Store.save('m-'+ds.slice(0,7));
function tot(list){const t={k:0,p:0,c:0,f:0,fb:0};for(const e of list){const m=e.g/100;t.k+=e.k*m;t.p+=e.p*m;t.c+=e.c*m;t.f+=e.f*m;t.fb+=(e.fb||0)*m}return t}
function weights(){const a=[];for(const mk of Object.keys(S.months).sort()){const ds=S.months[mk].days;for(const dk of Object.keys(ds).sort())if(ds[dk].w)a.push({d:mk+'-'+dk,t:dn(mk+'-'+dk),w:ds[dk].w})}return a}
/* Trend: exponentiell geglätteter Mittelwert, gleicht Wasser- und Tagesschwankungen aus */
function trend(ws){let tr=null,prev=null;return ws.map(x=>{if(tr==null)tr=x.w;else{const a=1-Math.pow(0.9,Math.max(1,x.t-prev));tr+=a*(x.w-tr)}prev=x.t;return{d:x.d,t:x.t,w:x.w,tr}})}
const curWeight=()=>{const t=trend(weights());return t.length?t[t.length-1].tr:null};

/* ---------- Energiemodell ---------- */
function profileOK(){const p=S.settings.profile;return!!(p&&p.sex&&p.birth>1900&&p.height>100&&p.act&&curWeight())}
function energy(){
  const p=S.settings.profile,cur=curWeight(),age=new Date().getFullYear()-p.birth;
  const bmr=10*cur+6.25*p.height-5*age+(p.sex==='m'?5:-161);      // Mifflin-St Jeor
  const formula=bmr*p.act;
  const T=dn(today()),W=28,ws=weights().filter(x=>x.t>=T-W);
  let obs=null,conf=0,nK=0,nW=ws.length,span=0,slope=null,avgIn=null;
  if(nW>=4){
    span=ws[nW-1].t-ws[0].t;
    const mx=ws.reduce((s,x)=>s+x.t,0)/nW,my=ws.reduce((s,x)=>s+x.w,0)/nW;
    let sxy=0,sxx=0;ws.forEach(x=>{sxy+=(x.t-mx)*(x.w-my);sxx+=(x.t-mx)**2});
    if(sxx>0&&span>=7){
      slope=sxy/sxx;                                              // kg pro Tag
      let sum=0;
      for(let t=ws[0].t;t<=Math.min(ws[nW-1].t,T-1);t++){const d=day(addD(today(),t-T));if(!d)continue;const k=tot(d.e).k;if(k>=0.5*bmr){sum+=k;nK++}}
      if(nK>=5){
        avgIn=sum/nK;
        obs=clamp(avgIn-slope*7700,formula*0.75,formula*1.3);    // Energiebilanz: Aufnahme minus Speicheränderung
        conf=clamp((nK-6)/12,0,1)*clamp((nW-4)/10,0,1)*clamp((span-10)/11,0,1);
      }
    }
  }
  const tdee=obs==null?formula:formula+conf*(obs-formula);
  return{cur,bmr,formula,obs,conf,tdee,nK,nW,span,slope,avgIn};
}
function calcTargets(){
  const e=energy(),st=S.settings,g=st.goal,p=st.profile,w=e.cur,h=p.height/100;
  const pct=g.type==='cut'?-g.rate:g.type==='bulk'?g.rate:0;
  let kcal=e.tdee+pct/100*w*7700/7;
  const floor=Math.max(e.bmr,p.sex==='m'?1500:1200),capped=kcal<floor;
  kcal=Math.round(Math.max(kcal,floor)/10)*10;
  const basis=w/(h*h)>30?27.5*h*h:w;                               // bei hohem BMI Referenzgewicht statt Körpergewicht
  const pk=st.prot||(g.type==='cut'?2.2:1.8);
  const P=Math.round(pk*basis);
  const F=Math.round(Math.max((g.type==='cut'?0.7:0.9)*basis,0.2*kcal/9));
  const C=Math.max(0,Math.round((kcal-4*P-9*F)/4));
  return{date:today(),kcal,p:P,f:F,c:C,fib:Math.round(14*kcal/1000),tdee:Math.round(e.tdee),conf:Math.round(e.conf*100),capped,pk};
}
function recalc(){
  if(!profileOK())return false;
  const t=calcTargets(),st=S.settings,h=st.tHist;
  st.targets=t;
  const row={date:t.date,kcal:t.kcal,tdee:t.tdee,conf:t.conf,p:t.p,c:t.c,f:t.f};
  if(h.length&&h[h.length-1].date===t.date)h[h.length-1]=row;else h.push(row);
  if(h.length>30)h.splice(0,h.length-30);
  return true;
}
/* Wöchentliche Rückkopplung: Ziele gelten eine Woche, montags wird neu gerechnet */
function ensureTargets(){const t=S.settings.targets;if(!profileOK())return;if(!t||weekStart(t.date)<weekStart(today())){recalc();Store.save('settings')}}
function isTrain(ds){return S.settings.trainDays.includes(wd(ds))||allW().some(w=>w.d===ds)}
function dayTargets(ds){
  const t=S.settings.targets;if(!t)return null;
  const n=S.settings.trainDays.length;let r=t;
  if(S.settings.cycle&&n>0&&n<7){const k=Math.round((isTrain(ds)?t.kcal*1.1:t.kcal*(1-0.1*n/(7-n)))/10)*10;r=Object.assign({},t,{kcal:k,c:Math.max(0,Math.round((k-4*t.p-9*t.f)/4)),fib:Math.round(14*k/1000)})}
  const a=actAdj(ds);
  if(a>0)r=Object.assign({},r,{kcal:r.kcal+a,c:r.c+Math.round(a/4),fib:Math.round(14*(r.kcal+a)/1000),act:a});   // Mehraktivität als Kohlenhydrate
  return r;
}
/* ---------- Aktivität: Schritte und Cardio ----------
   Schritte: Strecke aus Schrittlänge (0,414 × Körpergröße), netto rund 0,5 kcal pro kg und km.
   Cardio: (MET − 1) × Körpergewicht × Stunden; der Ruheumsatz steckt schon im Grundumsatz.
   Das Kalorienziel enthält bereits die durchschnittliche Aktivität (es folgt aus Gewichtstrend und Aufnahme).
   Angerechnet wird deshalb nur, was an einem Tag über dem eigenen Schnitt der letzten 28 Tage liegt. */
const CARDIO=[['Gehen, zügig',4.3],['Wandern',6],['Joggen, locker',8.3],['Laufen, zügig',10.5],['Radfahren, locker',6.8],['Radfahren, zügig',9],['Ergometer',6.8],['Crosstrainer',5],['Rudergerät',7],['Schwimmen, locker',5.8],['Schwimmen, zügig',9.8],['Intervalltraining',8],['Fußball',7],['Tennis',7.3],['Yoga, Mobility',2.5]];
const actW=()=>curWeight()||75;
const stepsKcal=n=>{const p=S.settings.profile,h=((p&&p.height)||175)/100;return n*0.414*h/1000*actW()*0.5};
const cardioKcal=(met,min)=>Math.max(0,(met-1)*actW()*min/60);
const hasAct=d=>!!(d&&d.act&&(d.act.steps||(d.act.cardio||[]).length));
function actK(ds){const d=day(ds);if(!hasAct(d))return 0;return stepsKcal(d.act.steps||0)+(d.act.cardio||[]).reduce((s,c)=>s+c.kcal,0)}
function actBase(ds){let s=0,n=0;for(let i=1;i<=28;i++){const x=addD(ds,-i);if(hasAct(day(x))){s+=actK(x);n++}}return{avg:n>=3?s/n:null,n}}
function actAdj(ds){if(S.settings.actAdj===false)return 0;const b=actBase(ds);if(b.avg==null)return 0;return Math.round(clamp(actK(ds)-b.avg,0,800)/10)*10}
const actDate=()=>ui.tab==='ernaehrung'?ui.date:today();
function actCard(ds){
  const d=day(ds)||{},a=d.act||{},k=actK(ds),b=actBase(ds),adj=actAdj(ds),list=a.cardio||[];
  const note=S.settings.actAdj===false?'Aktivität wird nur erfasst und nicht aufs Tagesziel angerechnet. Das lässt sich im Profil ändern.':b.avg==null?'Dein Ziel enthält schon deine übliche Aktivität. Ab drei Tagen mit Einträgen rechnet die App an, was über deinem Schnitt liegt (bisher '+b.n+').':'Dein Schnitt der letzten 28 Tage: '+f0(b.avg)+' kcal. '+(adj>0?'Heute liegst du darüber, das Ziel steigt um '+f0(adj)+' kcal.':'Du liegst im oder unter dem Schnitt, das Ziel bleibt.');
  return`<section class="card"><div class="chead"><h3>Aktivität</h3><span class="small muted num">${k?f0(k)+' kcal':''}</span></div>

  ${list.length?`<div class="list">`+list.map((c,i)=>`<button class="item" data-a="cardioedit" data-i="${i}"><span class="t"><b>${esc(c.t)}</b><span class="num">${c.min} Minuten</span></span><span class="v num">${f0(c.kcal)} kcal</span></button>`).join('')+`</div>`:''}
  <button class="btn" data-a="cardioadd">Cardio-Einheit eintragen</button><p class="hint">${ds===today()?note:note.replace('Heute liegst','An diesem Tag lagst').replace('Du liegst','Du lagst').replace('steigt','stieg').replace('bleibt','blieb')}</p></section>`;
}
function drawCardio(){const c=ui.cd,met=c.t<CARDIO.length?CARDIO[c.t][1]:null,est=met?cardioKcal(met,c.min||0):0;
  openSheet(`<div class="chead"><h2>Cardio-Einheit</h2><button class="navbtn" data-a="close">Abbrechen</button></div>

  <div class="grid2"><label>Dauer in Minuten<input id="cdM" inputmode="numeric" value="${c.min||''}" data-i="cdf" data-k="min"></label><label>Kalorien${met?' (optional)':''}<input id="cdK" inputmode="numeric" value="${c.kcal||''}" placeholder="${met?f0(est):'kcal'}" data-i="cdf" data-k="kcal"></label></div>
  <p class="hint" id="cdH">${met?'Geschätzt: '+f0(est)+' kcal zusätzlich zum Ruheumsatz. Hast du einen Wert von Uhr oder Gerät, trag ihn rechts ein.':'Trag die Kalorien von Uhr oder Gerät ein.'}</p>
  <p class="hint">Zählt dein iPhone die Schritte beim Laufen mit, trag entweder den Lauf oder die Schritte ein, sonst zählt die Strecke doppelt.</p>
  <div class="row"><button class="btn primary wide" data-a="cardiosave">${c.i==null?'Eintragen':'Speichern'}</button>${c.i!=null?'<button class="btn danger" data-a="cardiodel">Löschen</button>':''}</div>`)}



/* ---------- Training ---------- */
function allW(){const a=[];for(const k in S.wk)for(const w of S.wk[k].list)a.push(w);return a.sort((x,y)=>x.s-y.s)}
const saveW=w=>Store.save('t-'+w.d.slice(0,7));
const activeW=()=>allW().find(w=>!w.e)||null;
/* Geschätztes Maximum nach Epley. Wiederholungen bis zum Versagen = geschaffte Wiederholungen + Reserve (RIR).
   Sätze ohne RIR-Angabe werden mit 2 in Reserve gerechnet. */
const e1rm=(w,r,rir)=>w>0&&r>0?w*(1+(r+(rir==null?2:rir))/30):0;
const e1z=z=>e1rm(z.w,z.r,z.rir);
const volume=w=>w.ex.reduce((s,x)=>s+x.sets.reduce((a,z)=>a+(z.ok?(z.w||0)*(z.r||0):0),0),0);
const setCount=w=>w.ex.reduce((s,x)=>s+x.sets.filter(z=>z.ok).length,0);
function groupOf(n){for(const g of GROUPS)if(EX[g].includes(n))return g;const c=S.plans.ex.find(x=>x.n===n);return c?c.g:'Sonstige'}
function lastPerf(name,notId){const a=allW();for(let i=a.length-1;i>=0;i--){const w=a[i];if(w.id===notId||!w.e)continue;const x=w.ex.find(z=>z.n===name);if(x){const s=x.sets.filter(z=>z.ok);if(s.length)return{d:w.d,sets:s}}}return null}
function bestE(name,notId){let b=0;for(const w of allW()){if(w.id===notId)continue;for(const x of w.ex)if(x.n===name)for(const z of x.sets)if(z.ok)b=Math.max(b,e1z(z))}return b}
const stepOf=w=>w>=20?2.5:w>=8?1:0.5;
const targetRir=w=>w.rir==null?2:w.rir;
/* Vorgabe im Wiederholungsbereich (doppelte Progression mit RIR):
   Aus dem geschätzten Maximum folgt, wie viele Wiederholungen bei einem Gewicht mit der Zielreserve t möglich sind.
   Liegt das über dem Bereich, steigt das Gewicht; liegt es darunter, sinkt es. adj ist die erwartete Veränderung
   in Wiederholungen: +1 Fortschritt gegenüber der letzten Einheit, −1 Ermüdung gegenüber dem vorigen Satz. */
function rx(e1,W,t,min,max,adj){
  if(!(W>0)||!(e1>0))return null;
  const pr=w=>Math.round(30*(e1/w-1)-t+adj);
  let w=W,g=0,up=false;
  if(pr(w)>max){while(pr(w)>max&&pr(w+stepOf(w))>=min&&g++<60){w+=stepOf(w);up=true}}
  else if(pr(w)<min){while(pr(w)<min&&w-stepOf(w)>0&&g++<120)w-=stepOf(w)}
  return{w:+w.toFixed(2),r:clamp(pr(w)-(up&&adj>0?adj:0),min,max)};   // nach einer Gewichtserhöhung kein zusätzlicher Fortschritt eingerechnet
}
function setRx(wo,x,si){
  const t=targetRir(wo),done=x.sets.slice(0,si).filter(z=>z.ok&&z.r>0),prev=done.length?done[done.length-1]:null;
  if(prev){
    if(!(prev.w>0))return{w:0,r:Math.max(1,prev.r-1),src:'set'};
    return Object.assign(rx(e1z(prev),prev.w,t,x.min,x.max,-1),{src:'set'});
  }
  const l=lastPerf(x.n,wo.id);
  if(!l)return{w:null,r:Math.round((x.min+x.max)/2),src:'none'};
  const z0=l.sets[0],z=l.sets[Math.min(si,l.sets.length-1)],adj=wo.dl?0:1;
  if(!(z0.w>0))return{w:0,r:Math.max(1,z.r+adj),src:'last',l};
  const first=rx(e1z(z0),z0.w,t,x.min,x.max,adj);
  if(si===0||!(z.w>0))return Object.assign(first,{src:'last',l});
  return{w:first.w,r:clamp(Math.round(30*(e1z(z)/first.w-1)-t+adj),x.min,x.max),src:'last',l};
}
const rxLine=p=>p.w==null?p.r+' Wdh.':p.w>0?fw(p.w)+' kg × '+p.r:p.r+' Wdh.';
function rxWhy(p,x,t){
  if(p.src==='none')return'Erster Eintrag für diese Übung. Wähle ein Gewicht, mit dem '+x.min+'–'+x.max+' saubere Wiederholungen gehen und noch '+t+' in Reserve '+(t===1?'bleibt':'bleiben')+'.';
  if(p.src==='set')return'Berechnet aus deinem letzten Satz, etwas Ermüdung ist eingerechnet.';
  const z=p.l.sets[0],s=p.l.sets.map(q=>(q.w>0?fw(q.w)+' × ':'')+q.r+(q.rir!=null?' (RIR '+q.rir+')':'')).join(', ');
  const dir=!(z.w>0)?'':p.w>z.w?' Gewicht erhöht, weil das obere Ende des Bereichs erreicht ist.':p.w<z.w?' Gewicht gesenkt, damit du im Bereich '+x.min+'–'+x.max+' bleibst.':' Gleiches Gewicht, Ziel ist eine Wiederholung mehr.';
  return'Zuletzt ('+dshort(p.l.d)+'): '+s+'.'+dir;
}

/* ---------- Mesozyklus ---------- */
const meso=()=>S.plans.meso||null;
/* RIR-Verlauf: Standard 2 in Reserve, vorletzte Woche 1, letzte Woche 0; ab 6 Trainingswochen zwei Wochen mit 1. Deload mit 4. */
function rirPlan(n,deload){const a=[];for(let w=1;w<=n;w++){const fe=n-w;a.push(fe===0?0:(fe===1||(n>=6&&fe===2))?1:2)}if(deload)a.push(4);return a}
const mesoWeek=m=>clamp(Math.floor((dn(today())-dn(m.start))/7)+1,1,m.weeks);
const mesoOver=m=>dn(today())>dn(m.start)+7*m.weeks-1;
const mesoDone=(m,w,d)=>allW().find(x=>x.e&&x.ms&&x.ms.id===m.id&&x.ms.w===w&&x.ms.d===d)||null;
const isDl=(m,w)=>!!m.deload&&w===m.weeks;
function mesoStats(m){let done=0;for(let w=1;w<=m.weeks;w++)m.days.forEach(d=>{if(mesoDone(m,w,d.id))done++});return{planned:m.weeks*m.days.length,done}}
const mesoFinished=m=>mesoOver(m)||(m.days.length>0&&m.days.every(d=>mesoDone(m,m.weeks,d.id)));
function plannedToday(){const m=meso();if(!m||mesoOver(m)||dn(today())<dn(m.start))return null;const w=mesoWeek(m),i=m.days.findIndex(d=>d.wd===wd(today()));return i>=0&&!mesoDone(m,w,m.days[i].id)?m.days[i]:null}
function startW(p){
  const w={id:Date.now().toString(36),d:today(),name:p.name,s:Date.now(),e:null,rir:p.rir==null?2:p.rir,ex:p.ex.map(x=>({n:x.n,min:x.min,max:x.max,sets:Array.from({length:x.sets},()=>({w:null,r:null,ok:false}))}))};
  if(p.dl)w.dl=1;if(p.ms)w.ms=p.ms;
  const k=w.d.slice(0,7);(S.wk[k]=S.wk[k]||{list:[]}).list.push(w);saveW(w);ui.focus=true;ui.fx=0;ui.fsk=null;render();$('main').scrollTop=0;return w;
}

/* ---------- Trainingsplan-Generator ----------
   Grundlagen: Wochenvolumen pro Muskelgruppe ist die wichtigste Stellgröße (mehr Sätze bringen mehr, mit abnehmendem Ertrag;
   rund 4 Sätze gelten als Mindestdosis, 10–20 als üblicher Zielbereich). Hilfsmuskeln zählen halb. Die Häufigkeit ist bei
   gleichem Volumen zweitrangig, deshalb richtet sich die Aufteilung nach den verfügbaren Tagen; pro Einheit höchstens rund
   8 harte Sätze je Muskelgruppe. Sätze enden 0–2 Wiederholungen vor dem Versagen. */
const LVL={beg:['Einsteiger','Weniger als ein Jahr regelmäßiges Krafttraining',8],mid:['Fortgeschritten','Ein bis drei Jahre Training',12],adv:['Erfahren','Mehr als drei Jahre, Fortschritt wird zäh',16]};
const GF={'Beine':1.3,'Brust':1,'Rücken':1.15,'Schultern':.6,'Gesäß':.4,'Arme':.7,'Rumpf':.4};
const DT={GK:['Ganzkörper',['Beine','Brust','Rücken','Schultern','Gesäß','Arme','Rumpf'],{}],OK:['Oberkörper',['Brust','Rücken','Schultern','Arme'],{}],UK:['Unterkörper',['Beine','Gesäß','Rumpf'],{}],
  PU:['Push',['Brust','Schultern','Arme'],{'Schultern':'delt','Arme':'triceps'}],PL:['Pull',['Rücken','Schultern','Arme'],{'Schultern':'rdelt','Arme':'biceps'}],BE:['Beine',['Beine','Gesäß','Rumpf'],{}],
  PQ:['Push',['Brust','Beine','Schultern','Arme','Rumpf'],{'Schultern':'delt','Arme':'triceps','Beine':'quads'}],PH:['Pull',['Rücken','Beine','Gesäß','Schultern','Arme'],{'Schultern':'rdelt','Arme':'biceps','Beine':'hams'}]};
const SPLIT={2:['GK','GK'],3:['GK','GK','GK'],4:['OK','UK','OK','UK'],5:['OK','UK','PU','PL','BE'],6:['PU','PL','BE','PU','PL','BE']};
const POOL={gym:{
  'Brust':[['Bankdrücken','Kurzhantel-Schrägbankdrücken','Brustpresse (Maschine)'],['Kabel-Flys','Dips','Kurzhantel-Bankdrücken'],['Dips','Kabel-Flys','Kurzhantel-Schrägbankdrücken']],
  'Rücken':[['Latziehen','Langhantelrudern','Klimmzüge'],['Kabelrudern sitzend','Latziehen','Kurzhantelrudern'],['Kurzhantelrudern','T-Bar-Rudern','Hyperextensions']],
  'Schultern':[['Seitheben','Kurzhantel-Schulterdrücken','Seitheben'],['Face Pulls','Reverse Flys','Kurzhantel-Schulterdrücken'],['Reverse Flys','Face Pulls','Schulterdrücken (Langhantel)']],
  'Arme':[['Kurzhantelcurls','Langhantelcurls','Hammercurls'],['Trizepsdrücken (Kabel)','Skullcrusher','Trizepsdrücken (Kabel)'],['Hammercurls','Kurzhantelcurls','Skullcrusher']],
  'Beine':[['Kniebeuge','Beinpresse','Bulgarian Split Squat'],['Rumänisches Kreuzheben','Beinbeuger','Rumänisches Kreuzheben'],['Wadenheben','Beinstrecker','Wadenheben'],['Beinstrecker','Wadenheben','Beinbeuger']],
  'Gesäß':[['Hip Thrust','Kickbacks am Kabel','Glute Bridge'],['Abduktoren-Maschine','Hip Thrust','Kickbacks am Kabel']],
  'Rumpf':[['Hängendes Beinheben','Cable Crunch','Plank']]},
 home:{
  'Brust':[['Kurzhantel-Bankdrücken','Kurzhantel-Schrägbankdrücken','Liegestütze'],['Liegestütze','Kurzhantel-Bankdrücken','Dips']],
  'Rücken':[['Kurzhantelrudern','Klimmzüge','Kurzhantelrudern'],['Klimmzüge','Reverse Flys','Hyperextensions']],
  'Schultern':[['Seitheben','Kurzhantel-Schulterdrücken'],['Reverse Flys','Kurzhantel-Schulterdrücken']],
  'Arme':[['Kurzhantelcurls','Hammercurls'],['Skullcrusher','Dips']],
  'Beine':[['Bulgarian Split Squat','Ausfallschritte','Kniebeuge'],['Rumänisches Kreuzheben'],['Wadenheben'],['Ausfallschritte']],
  'Gesäß':[['Hip Thrust','Glute Bridge'],['Glute Bridge','Hip Thrust']],
  'Rumpf':[['Plank','Ab Wheel']]}};
const setCap=min=>clamp(Math.floor((min-8)*60/((S.settings.rest||120)+50)),5,26);
const estMin=sets=>Math.round(8+sets*((S.settings.rest||120)+50)/60);
function genMeso(c){
  const wds=c.wds.slice().sort((a,b)=>a-b),types=wds.length===3&&c.split3==='ppg'?['PQ','PH','GK']:SPLIT[clamp(wds.length,2,6)],cap=setCap(c.minutes),notes=[],base=LVL[c.level][2];
  const occ={};GROUPS.forEach(g=>occ[g]=[]);types.forEach((t,i)=>DT[t][1].forEach(g=>occ[g].push(i)));
  let T={};GROUPS.forEach(g=>T[g]=occ[g].length?Math.min(22,Math.round(base*GF[g])+(c.focus.includes(g)?Math.round(4*Math.max(.75,GF[g])):0)):0);
  const per=types.map(()=>({}));
  GROUPS.forEach(g=>{const d=occ[g],n=d.length;if(!n)return;const lim=g==='Beine'?11:8;let left=T[g];d.forEach((di,k)=>{let s=Math.min(lim,Math.round(left/(n-k)));if(s===1)s=2;per[di][g]=s;left-=s})});
  let tight=false;per.forEach(pd=>{const tot=Object.values(pd).reduce((a,b)=>a+b,0);if(tot>cap){tight=true;const f=cap/tot;Object.keys(pd).forEach(g=>pd[g]=Math.max(2,Math.round(pd[g]*f)))}});
  if(tight)notes.push('Die Zeit pro Einheit begrenzt das Volumen: Bei '+c.minutes+' Minuten passen rund '+cap+' Sätze in eine Einheit, deshalb liegt der Plan unter dem Zielvolumen für dein Niveau.');
  const cnt={},names=types.map(t=>{cnt[t]=(cnt[t]||0)+1;return cnt[t]});
  const days=types.map((t,di)=>{
    const[nm,gs,flt]=DT[t],kn=names[di]-1,used=[],ex=[];
    gs.forEach(g=>{const s=per[di][g]||0,k=occ[g].indexOf(di);if(s<2)return;
      const slots=POOL[c.equip][g],ok=n=>!used.includes(n)&&!c.avoid.includes(n)&&(!flt[g]||musOf(n).p.includes(flt[g]));
      const nEx=g==='Beine'?(flt[g]?(s<=4?1:2):s<=3?1:s<=8?2:s<=11?3:4):(s<=4?1:s<=7?2:3);
      for(let j=0;j<nEx;j++){
        let sj=j;if(g==='Arme'&&nEx===1&&!flt[g])sj=k%2;
        let opt=(slots[Math.min(sj,slots.length-1)]||[]).filter(ok);if(!opt.length)opt=[].concat(...slots).filter(ok);if(!opt.length)opt=EX[g].filter(ok);if(!opt.length)continue;
        const n=opt[k%opt.length];used.push(n);ex.push({n,sets:Math.floor(s/nEx)+(j<s%nEx?1:0),min:c.min,max:c.max});
      }});
    let tot=ex.reduce((a,x)=>a+x.sets,0),cut=false;
    while(tot>cap&&ex.length){cut=true;let i=ex.length-1;while(i>=0&&ex[i].sets<=2)i--;if(i>=0)ex[i].sets--;else ex.pop();tot=ex.reduce((a,x)=>a+x.sets,0)}
    
    return{wd:wds[di],name:nm+(cnt[t]>1?' '+'ABC'[kn]:''),ex};
  });
  return{days,notes,cap};
}
function planVolume(days){const v={};days.forEach(d=>d.ex.forEach(x=>{const m=musOf(x.n);m.p.forEach(k=>v[k]=(v[k]||0)+x.sets);m.s.forEach(k=>v[k]=(v[k]||0)+x.sets*.5)}));return v}
const volBand=s=>s<4?['unter der Mindestdosis','warn']:s<10?['solide Basis','']:s<=20?['im Zielbereich','good']:['sehr hoch','warn'];

/* ---------- Diagramme ---------- */
function chart(series,o){
  const W=340,H=160,L=38,R=10,T=10,B=22,all=series.flatMap(s=>s.pts);if(!all.length)return'';
  let x0=Math.min(...all.map(p=>p.x)),x1=Math.max(...all.map(p=>p.x)),y0=Math.min(...all.map(p=>p.y)),y1=Math.max(...all.map(p=>p.y));
  if(x1===x0)x1=x0+1;const yp=Math.max((y1-y0)*.12,o.pad||.5);y0-=yp;y1+=yp;
  const sx=x=>L+(x-x0)/(x1-x0)*(W-L-R),sy=y=>T+(1-(y-y0)/(y1-y0))*(H-T-B);
  let g='';
  [.1,.5,.9].forEach(q=>{const y=y0+(y1-y0)*q;g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${sy(y)}" y2="${sy(y)}"/><text x="${L-5}" y="${sy(y)+3}" text-anchor="end">${o.fy(y)}</text>`});
  g+=`<text x="${L}" y="${H-6}">${o.fx(x0)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${o.fx(x1)}</text>`;
  series.forEach(s=>{
    if(s.dots)s.pts.forEach(p=>g+=`<circle class="dot" cx="${sx(p.x)}" cy="${sy(p.y)}" r="2.3"/>`);
    if(s.line&&s.pts.length){g+=`<path class="ln" d="${s.pts.map((p,i)=>(i?'L':'M')+sx(p.x).toFixed(1)+' '+sy(p.y).toFixed(1)).join('')}"/>`;const e=s.pts[s.pts.length-1];g+=`<circle class="end" cx="${sx(e.x)}" cy="${sy(e.y)}" r="4.5"/>`}
  });
  return`<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label)}">${g}</svg>`;
}
const fxDay=n=>new Date(n*864e5).toLocaleDateString('de-DE',{day:'numeric',month:'short',timeZone:'UTC'});
function weekChart(ds){
  const ws=weekStart(ds),W=340,H=130,T=14,B=18,L=6,vals=WD.map((_,i)=>{const d=day(addD(ws,i));return d?tot(d.e).k:0});
  const tg=S.settings.targets?S.settings.targets.kcal:0,max=Math.max(tg*1.15,...vals,1),bw=(W-2*L)/7,sy=v=>T+(1-v/max)*(H-T-B);
  let g='';vals.forEach((v,i)=>{const x=L+i*bw+6;g+=`<rect class="b${v?'':' off'}" x="${x}" y="${v?sy(v):H-B-2}" width="${bw-12}" height="${v?H-B-sy(v):2}" rx="3"/><text x="${x+(bw-12)/2}" y="${H-5}" text-anchor="middle">${WD[i]}</text>`;if(v)g+=`<text x="${x+(bw-12)/2}" y="${sy(v)-3}" text-anchor="middle">${f0(v)}</text>`});
  if(tg)g+=`<line class="tg" x1="${L}" x2="${W-L}" y1="${sy(tg)}" y2="${sy(tg)}"/>`;
  return`<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Kalorien pro Tag in dieser Woche">${g}</svg>`;
}

/* ---------- Bausteine ---------- */
function hero(t,tg,ds){
  if(!tg)return`<section class="card hero"><div class="hnum"><b class="big num">${f0(t.k)}</b><span class="unit">kcal gegessen</span></div></section>`;
  const rem=tg.kcal-t.k,over=rem<0,C=2*Math.PI*42,q=clamp(t.k/tg.kcal,0,1);
  return`<section class="card hero${over?' over':''}"><svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle class="rt" cx="50" cy="50" r="42"/><circle class="rp" cx="50" cy="50" r="42" stroke-dasharray="${(q*C).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 50 50)"/></svg>
  <div class="hnum">${S.settings.cycle?`<span class="eyebrow">${isTrain(ds)?'Trainingstag':'Ruhetag'}</span>`:''}<b class="big num">${f0(Math.abs(rem))}</b><span class="unit">kcal ${over?'über dem Ziel':'übrig'}</span><span class="line num">Gegessen ${f0(t.k)} · Ziel ${f0(tg.kcal)}${tg.act?' (+'+f0(tg.act)+' Aktivität)':''}</span></div></section>`;
}
function macros(t,tg){
  const r=(lab,v,g,cl)=>`<div><div class="mbl"><span>${lab}</span><span class="num">${f0(v)}${g?' / '+f0(g):''} g</span></div><div class="bar"><i class="${cl}" style="width:${g?clamp(v/g*100,0,100):0}%"></i></div></div>`;
  return`<section class="card"><div class="macros">${r('Protein',t.p,tg&&tg.p,'p')}${r('Kohlenhydrate',t.c,tg&&tg.c,'c')}${r('Fett',t.f,tg&&tg.f,'f')}</div>
  <p class="small muted num">Ballaststoffe ${f0(t.fb)}${tg?' / '+tg.fib:''} g</p></section>`;
}
const needProfile=()=>`<section class="card"><h3>Ziele einrichten</h3><p class="small muted">Trag Körperdaten und Ziel ein. Daraus entstehen Kalorien- und Makrovorgaben, die sich danach wöchentlich an deinen Gewichtstrend anpassen.</p><a class="btn primary" href="#profil">Profil ausfüllen</a></section>`;

function search(q){

  if(!BLS.length)return{title:'Treffer',list:[...own,...FOODS.filter(m)].slice(0,40)};
  const sq=q.toLowerCase().replace(/[\s,]+/g,''),hit=BLS.filter(f=>tk.every(t=>f.lo.includes(t))||f.sq.includes(sq));

function drawTinfo(){openSheet(`<div class="chead"><h2>So wird gerechnet</h2><button class="navbtn" data-a="close">Fertig</button></div><div class="small" style="display:flex;flex-direction:column;gap:12px">
  <p><b>Wiederholungen in Reserve (RIR).</b> Nach jedem Satz gibst du an, wie viele saubere Wiederholungen noch gegangen wären. RIR 2 heißt: zwei wären noch drin gewesen. Die Schätzung liegt meist um etwa eine Wiederholung daneben und wird genauer, je näher du am Limit bist und je kürzer der Satz ist.</p>
  <p><b>Verlauf im Zyklus.</b> Standard sind 2 in Reserve, in der vorletzten Woche 1, in der letzten 0. Für Muskelaufbau zählt die Nähe zum Versagen; Sätze mit 0–2 in Reserve liefern den Reiz, ohne dass jede Einheit maximal ermüdet.</p>
  <p><b>Gewichtsvorgabe.</b> Aus Gewicht, Wiederholungen und Reserve der letzten Einheit wird dein Maximum geschätzt (Epley-Formel, Wiederholungen plus Reserve). Daraus folgt, wie viele Wiederholungen heute mit der Zielreserve möglich sind, plus eine als Fortschritt.</p>
  <p><b>Progression im Bereich.</b> Solange du im Bereich bleibst (Standard 8–12), bleibt das Gewicht und die Wiederholungen steigen. Wäre mehr als das obere Ende möglich, steigt das Gewicht um die kleinste Stufe und du beginnst wieder unten. Fällst du unter das untere Ende, sinkt das Gewicht.</p>
  <p><b>Innerhalb der Einheit.</b> Ab dem zweiten Satz rechnet die App vom gerade beendeten Satz aus. War er schwerer als geplant, wird der nächste leichter, und umgekehrt.</p>
  <p><b>Volumen.</b> Das Wochenvolumen pro Muskel ist die wichtigste Stellgröße: Mehr Sätze bringen mehr, aber mit abnehmendem Ertrag. Etwa 4 Sätze gelten als Mindestdosis, 10–20 als üblicher Zielbereich. Hilfsmuskeln zählen halb.</p>
  <p><b>Aufteilung und Pausen.</b> Bei gleichem Volumen ist die Häufigkeit zweitrangig, deshalb folgt die Aufteilung deinen Tagen. Pausen über einer Minute sind für den Aufbau leicht im Vorteil; die App rechnet mit deiner Pausenzeit aus dem Profil.</p>
  <p><b>Deload.</b> Die optionale letzte Woche halbiert die Sätze und lässt 4 in Reserve.</p></div>`)}

    const pl={name:p.name.trim(),ex:p.ex.map(x=>({n:x.n,sets:clamp(Math.round(x.sets)||3,1,10),min:Math.max(1,Math.round(x.min)||8),max:Math.max(Math.round(x.min)||8,Math.round(x.max)||12)}))};

    if(p.idx==null)S.plans.plans.push(pl);else S.plans.plans[p.idx]=pl;Store.save('plans');closeSheet();render()},
  pedelplan:()=>{if(ui.pe.kind==='day'){ui.me.days.splice(ui.pe.idx,1);return drawMeso()}

  wstart:el=>{const p=el.dataset.p==='free'?null:S.plans.plans[+el.dataset.p];startW(p?{name:p.name,ex:p.ex}:{name:'Freies Training',ex:[]});if(!p){ui.focus=false;render();A.exadd()}},
  mstart:el=>{const m=meso(),wk=+el.dataset.w,d=m.days[+el.dataset.d],dl=isDl(m,wk);

  mweek:el=>{ui.mw=clamp((ui.mw||1)+ +el.dataset.v,1,meso().weeks);render()},

  focusoff:()=>{ui.focus=false;render();$('main').scrollTop=0},

  fstep:el=>{const f=ui.fs,d=+el.dataset.d;if(el.dataset.k==='w'){const w=f.w||0;f.w=Math.max(0,+(w+d*stepOf(d<0?w-.01:w)).toFixed(2))}else f.r=Math.max(1,(f.r||0)+d);render()},
  frir:el=>{ui.fs.rir=+el.dataset.v;render()},
  fdone:()=>{const w=activeW(),x=w.ex[ui.fx],si=x.sets.findIndex(z=>!z.ok),f=ui.fs;if(si<0)return;if(!(f.r>0))return toast('Trag die Wiederholungen ein.');finishSet(w,x,x.sets[si],f.w||0,Math.round(f.r),f.rir)},

  exadd:()=>openSheet(`<div class="chead"><h2>Übung hinzufügen</h2><button class="navbtn" data-a="close">Abbrechen</button></div>${exPicker('exaddgo')}`),
  exaddgo:el=>{const n=pickedEx(el.dataset.src);if(!n)return;const w=activeW();w.ex.push({n,min:8,max:12,sets:[0,1,2].map(()=>({w:null,r:null,ok:false}))});ui.fx=w.ex.length-1;ui.fsk=null;saveW(w);closeSheet();render()},
  exinfo:el=>{const n=el.dataset.n,mu=musOf(n),l=lastPerf(n,(activeW()||{}).id),b=bestE(n,null);
    openSheet(`<div class="chead"><h2>${esc(n)}</h2><button class="navbtn" data-a="close">Fertig</button></div>

    ${mu.cue?`<div><h3>Ausführung</h3><p class="small muted" style="margin-top:4px">${esc(mu.cue)}</p></div>`:''}

  setrem:el=>{const w=activeW(),s=w.ex[+el.dataset.x].sets;if(s.length>1)s.pop();ui.fsk=null;saveW(w);render()},

  restskip:()=>{restEnd=0;$('#rest').classList.remove('on')},
  wfinish:()=>{const w=activeW();w.ex.forEach(x=>x.sets=x.sets.filter(z=>z.ok));w.ex=w.ex.filter(x=>x.sets.length);
    if(!w.ex.length){const l=S.wk[w.d.slice(0,7)].list;l.splice(l.indexOf(w),1);toast('Kein Satz abgehakt, Training nicht gespeichert')}else{w.e=Date.now();const m=meso();toast(m&&w.ms&&w.ms.id===m.id&&mesoFinished(m)?'Zyklus geschafft. Der Rückblick wartet im Trainingsbereich.':'Training gespeichert')}
    saveW(w);restEnd=0;ui.fsk=null;render();$('main').scrollTop=0},
  wdiscard:()=>confirmSheet('Training verwerfen','Alle Sätze dieses Trainings gehen verloren.','Verwerfen',()=>{const w=activeW(),l=S.wk[w.d.slice(0,7)].list;l.splice(l.indexOf(w),1);saveW(w);restEnd=0;render()}),
  wshow:el=>{const w=allW().find(x=>x.id===el.dataset.id);ui.wid=w.id;const rs=w.ex.flatMap(x=>x.sets.filter(z=>z.rir!=null).map(z=>z.rir));
    openSheet(`<div class="chead"><h2>${esc(w.name)}</h2><button class="navbtn" data-a="close">Fertig</button></div><p class="small muted num" style="text-align:center">${dlabel(w.d)} · ${Math.round((w.e-w.s)/6e4)} min · ${f0(volume(w))} kg bewegt${w.ms?' · Woche '+w.ms.w:''}</p><div class="mapbox">${bodyMap(exLevels(w.ex.map(x=>x.n)),'lg')}</div>
    ${rs.length?`<div class="stats"><div class="stat"><b class="num">${targetRir(w)}</b><span>Ziel-RIR</span></div><div class="stat"><b class="num">${f1(rs.reduce((a,b)=>a+b,0)/rs.length)}</b><span>Ø RIR erreicht</span></div><div class="stat"><b class="num">${setCount(w)}</b><span>Sätze</span></div></div>`:''}
    ${w.ex.map(x=>`<div><h3>${esc(x.n)}</h3><p class="small num muted">${x.sets.map(z=>fw(z.w||0)+' kg × '+z.r+(z.rir!=null?' (RIR '+z.rir+')':'')).join(' · ')}</p></div>`).join('')}<button class="btn danger" data-a="wdel">Training löschen</button>`)},
  wdel:()=>confirmSheet('Training löschen','Das Training wird dauerhaft aus dem Verlauf entfernt.','Löschen',()=>{const w=allW().find(x=>x.id===ui.wid),l=S.wk[w.d.slice(0,7)].list;l.splice(l.indexOf(w),1);saveW(w);render()}),
  tinfo:()=>drawTinfo(),

  gnext:()=>{const g=ui.gen;if(g.step===1&&(g.wds.length<2||g.wds.length>6))return toast('Wähl zwei bis sechs Tage.');if(g.step===5){g.min=clamp(Math.round(g.min)||8,1,30);g.max=clamp(Math.round(g.max)||12,g.min,40)}g.step++;drawGen()},

    S.plans.meso={id:newId('m'),name:'Mesozyklus '+((S.plans.mesoHist||[]).length+1),start:addD(weekStart(today()),g.when?7:0),tw:g.weeks,deload:g.deload,weeks:g.weeks+(g.deload?1:0),rir:rirPlan(g.weeks,g.deload),
      days:g.out.days.map(d=>Object.assign({id:newId('d')},d)),cfg:{level:g.level,wds:g.wds.slice().sort((a,b)=>a-b),minutes:g.minutes,focus:g.focus.slice(),equip:g.equip,weeks:g.weeks,deload:g.deload,min:g.min,max:g.max,avoid:g.avoid.slice(),split3:g.split3||'gk'}};

  medit:()=>{ui.me=clone(meso());if(ui.me.tw==null)ui.me.tw=ui.me.weeks-(ui.me.deload?1:0);drawMeso()},
  mday:el=>{ui.pe=Object.assign({kind:'day',idx:+el.dataset.d},clone(ui.me.days[+el.dataset.d]));drawPlan()},
  mdayadd:()=>{const used=ui.me.days.map(d=>d.wd),w=[0,1,2,3,4,5,6].find(x=>!used.includes(x));ui.pe={kind:'day',idx:null,name:'',wd:w==null?0:w,ex:[]};drawPlan()},
  msave:()=>{const m=ui.me;if(!m.name.trim())return toast('Gib dem Zyklus einen Namen.');if(!m.days.length||m.days.some(d=>!d.ex.length))return toast('Jeder Trainingstag braucht mindestens eine Übung.');
    m.weeks=m.tw+(m.deload?1:0);S.plans.meso=m;S.settings.trainDays=[...new Set(m.days.map(d=>d.wd))].sort((a,b)=>a-b);Store.save('plans');Store.save('settings');ui.mw=null;closeSheet();render()},

const C={
  steps:el=>{const v=num(el.value),ds=actDate(),d=day(ds,1);if(v!=null&&(v<0||v>100000))return toast('Bitte eine Schrittzahl bis 100.000 eintragen.');d.act=d.act||{};if(v)d.act.steps=Math.round(v);else delete d.act.steps;saveDay(ds);render()},

  wt:el=>{const v=num(el.value),d=day(today(),1);if(v==null||v===0)delete d.w;else if(v<30||v>300)return toast('Bitte ein Gewicht zwischen 30 und 300 kg eintragen.');else d.w=v;saveDay(today());

  pf:el=>{const k=el.dataset.k,st=S.settings;st.profile=st.profile||{};const v=el.value;

    recalc();Store.save('settings');render()},
  setrir:el=>{const w=activeW();if(!w)return;w.ex[+el.dataset.x].sets[+el.dataset.s].rir=+el.value;saveW(w)},

  mec:el=>{const m=ui.me,k=el.dataset.k;if(k==='start'){if(el.value)m.start=weekStart(el.value)}else{if(k==='tw')m.tw=+el.value;else m.deload=el.checked;m.rir=rirPlan(m.tw,m.deload)}keepS(drawMeso)},

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&A[el.dataset.a])A[el.dataset.a](el)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-c]');if(el&&C[el.dataset.c])C[el.dataset.c](el)});

  catch(err){toast('Diese Datei ist keine Sicherung des Fitness-Logbuchs.')}});
